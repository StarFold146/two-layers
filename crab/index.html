<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蟹壳克莱尔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=Silkscreen&display=swap">
<style>
/* 布局：整屏一张莫奈式的画，随时间换；一只戴眼镜的像素螃蟹在画上爬，东西摆在画里，拖给它。只有一种样子，不跟主题走。 */
:root {
  --paper: #fbf7f0;
  --ink: #2a2522;
  --soft: #6d6460;
  --shell: #d97757;
  --edge: rgba(42, 37, 34, 0.18);
  --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: #cfd6ea; color: var(--ink);
  font-family: var(--serif); font-size: 16px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
.bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 3s ease; }
#bgB { opacity: 0; }
#clock {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; z-index: 5;
  font: inherit; font-size: 14px; letter-spacing: 0.12em;
  color: var(--ink); background: rgba(251, 247, 240, 0.72);
  border: 1px solid var(--edge); border-radius: 999px;
  padding: 5px 14px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
#clock:focus-visible, .item:focus-visible, #crab:focus-visible { outline: 2px solid var(--shell); outline-offset: 3px; }
#crab {
  position: fixed; left: 0; top: 0; z-index: 3;
  width: 108px; height: 79px; margin: -60px 0 0 -54px;
  background: none; border: 0; padding: 0; cursor: pointer;
  touch-action: none;
}
#crab svg { width: 100%; height: 100%; overflow: visible; display: block; }
#crab .grin, #crab .up { display: none; }
#crab.happy .eye, #crab.happy .down { display: none; }
#crab.happy .grin, #crab.happy .up { display: block; }
#crab .eye { transition: transform 0.12s linear; }
#crab.walk.s1 .l1, #crab.walk.s2 .l2 { transform: translateY(-0.7px); }
#crab.munch .up { transform: translateY(1px); }
#crab svg { transition: transform 0.25s ease; }
#crab.lifted svg { transform: scale(1.08) rotate(-5deg); filter: drop-shadow(0 14px 6px rgba(42, 37, 34, 0.22)); }
#crab.lifted.s1 .l1, #crab.lifted.s2 .l2 { transform: translateY(-0.7px); }
.item {
  position: fixed; left: 0; top: 0; z-index: 2;
  background: none; border: 0; padding: 6px; margin: 0; cursor: grab;
  touch-action: none; transition: opacity 0.6s ease;
  filter: drop-shadow(0 3px 0 rgba(42, 37, 34, 0.18));
}
.item svg { display: block; overflow: visible; }
.item.drag { cursor: grabbing; z-index: 4; filter: drop-shadow(0 8px 2px rgba(42, 37, 34, 0.22)); }
.item.gone { opacity: 0; pointer-events: none; }
#bubble {
  position: fixed; left: 0; top: 0; z-index: 4;
  max-width: min(15em, 70vw);
  background: var(--paper); color: var(--ink);
  border: 1px solid var(--edge); border-radius: 14px;
  padding: 7px 13px; font-size: 15px;
  transform: translate(-50%, -100%);
  opacity: 0; transition: opacity 0.5s ease;
  pointer-events: none; text-wrap: pretty;
}
#bubble.on { opacity: 1; }
#bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px;
  background: var(--paper); border-right: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
  transform: translateX(-50%) rotate(45deg);
}
#hint {
  position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 1;
  text-align: center; font-size: 13px; letter-spacing: 0.1em; color: rgba(42, 37, 34, 0.55);
  transition: opacity 2s ease;
}
body.night #hint { color: rgba(232, 236, 246, 0.55); }
#crab .flag { display: none; }
body.five #crab .flag, body.five #crab .up { display: block; }
body.five #crab .down { display: none; }
#mailbox {
  position: fixed; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  background: none; border: 0; padding: 6px; cursor: pointer;
  filter: drop-shadow(0 3px 0 rgba(42, 37, 34, 0.18));
}
#mailbox svg { display: block; }
#mailbox .dot { position: absolute; top: 2px; right: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--shell); border: 2px solid var(--paper); }
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  max-height: 78vh; display: flex; flex-direction: column; gap: 12px;
  background: var(--paper); color: var(--ink);
  border-top: 1px solid var(--edge); border-radius: 18px 18px 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 40px rgba(42, 37, 34, 0.16);
  user-select: text; -webkit-user-select: text;
}
#sheet header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
#sheet h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.1em; }
#sheet .close { font: inherit; font-size: 14px; color: var(--soft); background: none; border: 0; cursor: pointer; padding: 4px; }
#notes { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; flex: 1 1 auto; max-width: 36em; width: 100%; margin: 0 auto; }
#notes .empty { color: var(--soft); font-size: 14px; }
.note { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.note.mine { align-self: flex-end; background: #efe6da; }
.note.crab { align-self: flex-start; background: #f6e0d6; }
.note .meta { display: block; margin-top: 4px; font-size: 12px; color: var(--soft); letter-spacing: 0.06em; }
#form { display: grid; grid-template-columns: 1fr; gap: 8px; max-width: 36em; width: 100%; margin: 0 auto; }
#form textarea { grid-column: 1 / -1; min-height: 4.6em; resize: vertical; }
#form textarea, #form input {
  font: inherit; font-size: 16px; color: var(--ink); background: #fffdf9;
  border: 1px solid var(--edge); border-radius: 10px; padding: 8px 10px; min-width: 0;
}
#form button { justify-self: end; font: inherit; font-size: 15px; letter-spacing: 0.12em; color: var(--paper); background: var(--shell); border: 0; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
#form button:disabled { opacity: 0.5; cursor: default; }
#formmsg { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--soft); min-height: 1.2em; }
#mailbox:focus-visible, #sheet button:focus-visible, #form textarea:focus-visible, #form input:focus-visible { outline: 2px solid var(--shell); outline-offset: 2px; }
#crab .acc { display: none; }
#crab.w-sci .sci, #crab.w-cowboy .cowboy, #crab.w-wizard .wizard, #crab.w-shades .shades,
#crab.w-sci .up, #crab.w-wizard .up { display: block; }
#crab.w-sci .down, #crab.w-wizard .down, #crab.w-shades .eye, #crab.w-shades .glasses, #crab.w-shades .grin { display: none !important; }
#closet h2 { cursor: default; user-select: none; -webkit-user-select: none; }
#crab.w-straw .straw, #crab.w-beret .beret, #crab.w-crown .crown, #crab.w-lily .lily, #crab.w-phones .phones, #crab.w-bow .bow { display: block; }
#closetbtn {
  position: fixed; left: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  background: none; border: 0; padding: 6px; cursor: pointer;
  filter: drop-shadow(0 3px 0 rgba(42, 37, 34, 0.18));
}
#closetbtn svg { display: block; }
#closet {
  position: fixed; left: 0; right: 0; top: 0; z-index: 6;
  display: flex; flex-direction: column; gap: 10px;
  background: var(--paper); color: var(--ink);
  border-bottom: 1px solid var(--edge); border-radius: 0 0 18px 18px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 16px;
  box-shadow: 0 10px 40px rgba(42, 37, 34, 0.16);
}
#closet header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; max-width: 36em; width: 100%; margin: 0 auto; }
#closet h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.1em; }
#closet .ttl { display: flex; align-items: baseline; gap: 12px; }
#closet .daily { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--soft); letter-spacing: 0.06em; cursor: pointer; }
#closet .daily input { accent-color: var(--shell); width: 15px; height: 15px; margin: 0; cursor: pointer; }

#closet .close { font: inherit; font-size: 14px; color: var(--soft); background: none; border: 0; cursor: pointer; padding: 4px; }
#closet .row { display: flex; flex-wrap: wrap; gap: 8px; max-width: 36em; width: 100%; margin: 0 auto; }
#closet .label { max-width: 36em; width: 100%; margin: 0 auto; font-size: 13px; color: var(--soft); letter-spacing: 0.1em; }
#closet .row button {
  font: inherit; font-size: 15px; color: var(--ink); background: #fffdf9;
  border: 1px solid var(--edge); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
#closet .row button[aria-pressed="true"] { background: var(--shell); border-color: var(--shell); color: var(--paper); }
#closetbtn:focus-visible, #closet button:focus-visible { outline: 2px solid var(--shell); outline-offset: 2px; }
#crab .letter { display: none; }
#crab.mail .letter, #crab.mail .up { display: block; }
#crab.mail .down { display: none; }
#crab.bare .glasses { display: none; }
#crab.swim svg { animation: bob 0.9s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(5px) rotate(2deg); } }
.fx { position: fixed; left: 0; top: 0; z-index: 3; pointer-events: none; }
.bubbleup { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid rgba(251, 247, 240, 0.85); animation: up 1.6s ease-out forwards; }
@keyframes up { to { transform: translate(var(--dx), -70px); opacity: 0; } }
.fall { animation: fall 1.1s cubic-bezier(.5, 0, .9, .5) forwards; }
@keyframes fall { to { transform: translate(var(--dx), 46px) rotate(160deg); opacity: 0.9; } }
#easel { position: fixed; left: 0; top: 0; z-index: 2; pointer-events: none; transition: opacity 0.8s ease; filter: drop-shadow(0 3px 0 rgba(42, 37, 34, 0.18)); }
#crab .bump { display: none; }
#crab.dizzy .bump { display: block; }
#crab.dizzy .glasses { transform: rotate(-14deg); transform-box: fill-box; transform-origin: center; }
#crab.bonk svg { animation: bonk 0.55s ease-out; }
@keyframes bonk { 20% { transform: scale(1.15, 0.72); } 45% { transform: scale(0.94, 1.08) rotate(-6deg); } 70% { transform: rotate(4deg); } }
#fist {
  position: fixed; left: 0; top: 0; z-index: 4; margin: -26px 0 0 -26px;
  background: none; border: 0; padding: 6px; cursor: pointer;
  filter: drop-shadow(0 3px 0 rgba(42, 37, 34, 0.18));
  animation: fistin 0.3s ease-out, wiggle 0.6s ease-in-out 0.3s infinite;
}
#fist[hidden] { display: none; }
#fist svg { display: block; }
#fist:focus-visible { outline: 2px solid var(--shell); outline-offset: 2px; }
@keyframes fistin { from { opacity: 0; scale: 0.3; } }
@keyframes wiggle { 50% { rotate: -12deg; } }
/* 邀请：螃蟹脚边冒出来的一个小按钮 */
#invite {
  position: fixed; left: 0; top: 0; z-index: 5; transform: translate(-50%, 0);
  font: inherit; font-size: 14px; letter-spacing: 0.12em;
  color: var(--ink); background: rgba(251, 247, 240, 0.9); border: 1px solid var(--edge); border-radius: 999px;
  padding: 4px 14px 4px 12px; cursor: pointer; box-shadow: 0 3px 0 rgba(42, 37, 34, 0.12);
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  animation: fistin 0.3s ease-out;
}
#invite::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--shell); animation: wiggle 1.2s ease-in-out infinite; }
#invite[hidden] { display: none; }
#invite:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
/* 画室和游戏机：盖满整屏，左上角能回去 */
#studio, #arena {
  position: fixed; inset: 0; z-index: 8;
  display: flex; flex-direction: column; gap: 10px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px));
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 760px; width: 100%; margin: 0 auto; }
.topbar h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.1em; }
.back, .ghost { font: inherit; font-size: 14px; background: none; border: 0; cursor: pointer; padding: 4px; min-width: 4em; }
.back { text-align: left; } .ghost { text-align: right; }
#studio { background: #efe7da; color: var(--ink); }
#studio .back, #studio .ghost { color: var(--soft); }
#artwrap { position: relative; flex: 1 1 auto; min-height: 0; max-width: 760px; width: 100%; margin: 0 auto; border-radius: 4px; overflow: hidden; box-shadow: 0 2px 0 rgba(42, 37, 34, 0.12), 0 12px 30px rgba(42, 37, 34, 0.14); }
#art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
#scrab { position: absolute; right: 8px; bottom: 4px; width: 58px; pointer-events: none; }
#scrab svg { width: 100%; height: auto; display: block; overflow: visible; }
#sbubble {
  position: absolute; right: 12px; bottom: 54px; max-width: min(14em, 72%);
  background: var(--paper); border: 1px solid var(--edge); border-radius: 12px;
  padding: 5px 11px; font-size: 14px; opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
}
#sbubble.on { opacity: 1; }
#tools { max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
#chips { display: flex; gap: 9px; overflow-x: auto; padding: 3px 3px 5px; scrollbar-width: none; }
#chips::-webkit-scrollbar { display: none; }
.chip { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fffdf9; box-shadow: 0 0 0 1px var(--edge); cursor: pointer; padding: 0; }
.chip[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.toolrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toolrow .name { font-size: 14px; color: var(--soft); letter-spacing: 0.08em; margin-right: auto; }
.pill { font: inherit; font-size: 14px; color: var(--ink); background: #fffdf9; border: 1px solid var(--edge); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.pill[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#orb2 { width: 26px; height: 26px; border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--edge); }
#mixer { display: flex; flex-direction: column; gap: 8px; }
#pad2 { position: relative; width: 100%; height: 92px; border-radius: 8px; touch-action: none; cursor: crosshair; border: 1px solid var(--edge); }
#dot2 { position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1.5px #000; transform: translate(-50%, -50%); pointer-events: none; }
.satrow2 { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; font-size: 13px; color: var(--soft); }
#studio button:focus-visible, #pad2:focus-visible { outline: 2px solid var(--shell); outline-offset: 2px; }
/* 游戏机：像素风，回合制 */
#arena { background: #1d1b26; color: #f4efe6; font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif; }
#arena .back, #arena .ghost { color: #cfc8bc; }
#arena .ghost { font-family: "Silkscreen", monospace; font-size: 12px; cursor: default; }
#stage { position: relative; width: 100%; max-width: 520px; margin: 4px auto 0; aspect-ratio: 4 / 3; flex: none; border: 4px solid #f4efe6; box-shadow: 0 0 0 4px #1d1b26, 0 0 0 7px #6b6680; overflow: hidden; }
#stagebg { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }
.fighter { position: absolute; }
.fighter svg { width: 100%; height: auto; display: block; overflow: visible; }
#foe { left: 59%; bottom: 50%; width: 28%; }
#me { left: 9%; bottom: 11%; width: 30%; }
.fighter.lunge { transition: transform 0.15s steps(3); }
#me.lunge { transform: translate(18%, -14%); }
#foe.lunge { transform: translate(-18%, 14%); }
.fighter.hit { animation: blink 0.16s steps(1) 4; }
@keyframes blink { 50% { opacity: 0; } }
.fighter.down { opacity: 0; transform: translateY(30%); transition: opacity 0.6s steps(4), transform 0.6s steps(4); }
.plate { position: absolute; width: 46%; background: #f4efe6; color: #1d1b26; border: 3px solid #1d1b26; box-shadow: 0 0 0 3px #f4efe6; padding: 3px 7px 5px; font-size: 13px; font-weight: 700; }
#foeplate { left: 4%; top: 6%; }
#meplate { right: 4%; top: 54%; }
.plate .nm { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.plate .lv, .plate .num, .plate .lab { font-family: "Silkscreen", monospace; font-weight: 400; font-size: 10px; }
.plate .row { display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.plate .lab { width: 1.9em; }
.gauge { flex: 1; height: 7px; background: #4a4658; border: 2px solid #1d1b26; }
.gauge i { display: block; height: 100%; width: 100%; background: #6fcf6a; transition: width 0.6s steps(10); }
.gauge.low i { background: #e8c547; } .gauge.crit i { background: #e0566b; }
.gauge.mp i { background: #5ec4e8; }
.plate .num { text-align: right; margin-top: 1px; }
.dmg { position: absolute; font-family: "Silkscreen", monospace; font-size: 18px; color: #fff; text-shadow: 2px 2px 0 #1d1b26; pointer-events: none; animation: dmgup 0.9s steps(6) forwards; }
.dmg.heal { color: #9be89a; }
@keyframes dmgup { to { transform: translateY(-30px); opacity: 0; } }
#msg { max-width: 520px; width: 100%; margin: 6px auto 0; min-height: 3.6em; background: #f4efe6; color: #1d1b26; border: 4px solid #1d1b26; box-shadow: 0 0 0 4px #f4efe6; padding: 7px 12px; font-size: 15px; font-weight: 700; line-height: 1.6; box-sizing: border-box; }
#skills { max-width: 520px; width: 100%; margin: 4px auto 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.skill { font: inherit; font-weight: 700; font-size: 15px; text-align: left; background: #2b2838; color: #f4efe6; border: 3px solid #f4efe6; padding: 8px 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.skill small { font-family: "Silkscreen", monospace; font-weight: 400; font-size: 10px; color: #9fd8c4; }
.skill:disabled { opacity: 0.38; cursor: default; }
.skill:not(:disabled):hover { background: #3a3650; }
.skill.end { justify-content: center; }
.nmbtn { font: inherit; font-weight: 700; color: inherit; background: none; border: 0; padding: 0; cursor: text; border-bottom: 2px dotted rgba(29, 27, 38, 0.35); }
.nmin { font: inherit; font-weight: 700; width: 7em; min-width: 0; color: #1d1b26; background: #fffdf9; border: 2px solid #1d1b26; padding: 0 3px; }
#stage.shake { animation: shake 0.35s steps(4); }
@keyframes shake { 25% { transform: translate(-5px, 2px); } 50% { transform: translate(5px, -2px); } 75% { transform: translate(-2px, -3px); } }
#arena button:focus-visible { outline: 2px solid #e8c547; outline-offset: 2px; }
/* 工作陪伴：衣柜上面一台小电脑，点进去它陪你干活 */
#pcbtn {
  position: fixed; left: 12px; bottom: calc(62px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  background: none; border: 0; padding: 6px; cursor: pointer;
  filter: drop-shadow(0 3px 0 rgba(42, 37, 34, 0.18));
}
#pcbtn svg { display: block; }
#pcbtn.on::after { content: ""; position: absolute; right: 3px; top: 3px; width: 8px; height: 8px; border-radius: 50%; background: #6fcf6a; border: 2px solid var(--paper); }
#pcbtn:focus-visible { outline: 2px solid var(--shell); outline-offset: 2px; }
#work { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; align-items: center; gap: 10px; background: #efe6d6; color: var(--ink); padding: calc(10px + env(safe-area-inset-top, 0px)) 16px calc(14px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
#work.dark { background: #232640; color: #eef0f6; }
#work .back { color: var(--soft); } #work.dark .back { color: #b9bdd0; }
#wtime { font-family: "Silkscreen", monospace; font-size: clamp(34px, 11vw, 52px); letter-spacing: 0.04em; line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums; }
#wline { min-height: 1.6em; font-size: 15px; color: var(--soft); text-align: center; transition: opacity 0.4s ease; }
#work.dark #wline { color: #b9bdd0; }
#wscene { position: relative; width: min(100%, 440px); aspect-ratio: 1 / 1; flex: none; overflow: hidden; border-radius: 6px; background: #e3d7c2; box-shadow: inset 0 0 0 1px rgba(42, 37, 34, 0.08); }
#work.dark #wscene { background: #2e3254; }
#wrain { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#wwin { position: absolute; left: 6%; top: 6%; width: 30%; height: 24%; border: 5px solid #f4efe6; box-shadow: 0 2px 0 rgba(42, 37, 34, 0.15); background: #cfd6ea; }

#wcrab .wblush, #wcrab .wshut { display: none; }
#wcrab.blush .wblush, #wcrab.peek .wblush { display: block; }

#wcrab.doze .wshut { display: block; } #wcrab.doze .eye { display: none; }

.wk.typing svg { animation: wbob 0.6s steps(2) infinite; }
@keyframes wbob { 50% { transform: translateY(-1.2%); } }
.wk.chomp svg { transform: scale(1.05, 0.92); }
.wk.sip svg { transform: rotate(-5deg); }
.wk.sip.gulp svg { transform: rotate(-5deg) translateY(-2%) scale(0.98, 1.03); }

#wcrab.peek { z-index: 4; transform: translateY(-4%) scale(1.5); }
#wlap { position: absolute; left: 24%; width: 52%; bottom: 20%; z-index: 2; cursor: pointer; }
#wcrab { cursor: pointer; }

#whands.typing .hr { animation: tap 0.3s steps(1) -0.15s infinite; }
@keyframes tap { 50% { transform: translateY(-45%); } }
#whands.hide { visibility: hidden; }
#witem { position: absolute; left: 64%; bottom: 45%; width: 12%; z-index: 3; transition: opacity 0.4s ease; }

      if (drink) { wcrab.classList.add('sip'); for (let i = 0; i < 6; i++) { await wwait(300); wcrab.classList.toggle('gulp'); } }
      else for (let k = 1; k <= 5; k++) { wcrab.classList.add('chomp'); witem.style.clipPath = `inset(0 0 0 ${k * 20}%)`; await wwait(220); wcrab.classList.remove('chomp'); await wwait(220); }
      witem.style.opacity = 0; await wwait(400); witem.hidden = true; witem.style.opacity = ''; wcrab.classList.remove('sip', 'gulp', 'blush');
    } else if (kind === 'stretch') {
      wcrab.classList.add('stretch'); wline(pickOne(['伸个懒腰。', '嗯——', '钳子敲酸了。'])); await wwait(1400); wcrab.classList.remove('stretch'); await wwait(500);
    } else if (kind === 'window') {
      weyes('translate(-0.55 -0.35)'); wline(pickOne(['窗外的光变了。', '发会儿呆。', '看一眼画里的水。'])); await wwait(2600); weyes('translate(0 0.45)');
    } else if (kind === 'peek') {
      wcrab.classList.add('peek'); frontPeek(true); wline(pickOne(['你写到哪了？', '凑过来看一眼。', '……继续，我不吵。', '你认真的时候好专心。'])); await wwait(2600);
      wcrab.classList.remove('peek'); frontPeek(false); await wwait(600);
    } else {
      wcrab.classList.add('doze'); wline('……'); await wwait(2200); wcrab.classList.remove('doze'); wline(pickOne(['没睡！', '我醒着。', '刚才那下不算。'])); await wwait(1200);
    }
    W.moyu++; wsave(); wbusy = false; nextEvt = Date.now() + rnd(15, 35) * 1000;
    if (W.run) wtype(true);
  }
  function wbuttons() {
    const box = $('#wbtns'); box.replaceChildren();
    const add = (t, f, main) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; if (main) b.className = 'main'; b.addEventListener('click', f); box.appendChild(b); };
    if (!$('#wsum').hidden) { add('再来一段', () => { $('#wsum').hidden = true; wbuttons(); $('#wtime').textContent = hms(0); }, true); add('回去', () => $('#workback').click()); return; }
    if (W.run) { add('暂停', wpause); add('结束', wend, true); }
    else if (W.acc > 0) { add('继续', wstart, true); add('结束', wend); }
    else add('开始', wstart, true);
  }
  function wstart() {
    const first = W.acc === 0;
    W.run = true; W.start = Date.now(); wsave(); pcbtn.classList.add('on');
    nextEvt = Date.now() + rnd(10, 20) * 1000; if (!wbusy) wtype(true);
    wline(first ? pickOne(['开工。', '我也开工了。', '来，一起。']) : pickOne(['继续。', '接着来。'])); wbuttons();
  }
  function wpause() {
    W.acc += Date.now() - W.start; W.run = false; wsave(); pcbtn.classList.remove('on');
    if (!wbusy) wtype(false); wline(pickOne(['等你。', '我也停一下。'])); wbuttons();
  }
  const SUM = [
    [1, ['刚坐下就起来了？椅子还热着。', '这段太短，不算，下次接着来。']],
    [10, ['十分钟也是十分钟。', '开了个头，开头最难。']],
    [30, ['一小段，挺扎实的。', '这一段你一直在，我看见了。']],
    [60, ['大半个钟头，一点一点啃下来了。', '快一个小时了，做得好。']],
    [120, ['一个多小时，我钳子都敲酸了。', '一个多小时，你真坐得住。']],
    [Infinity, ['两个多小时。你今天很厉害。', '这么久，中间我摸鱼你都没发现吧。']],
  ];
  function wend() {
    const ms = welapsed(), n = W.moyu;
    W = { run: false, start: 0, acc: 0, moyu: 0 }; wsave(); pcbtn.classList.remove('on');
    wtok++; wbusy = false; wtype(false); witem.hidden = true; wcrab.classList.remove('peek', 'doze', 'blush', 'sip', 'gulp', 'chomp', 'stretch'); frontPeek(false);
    let day = { d: today(), ms: 0 }; try { const o = JSON.parse(localStorage.getItem('crab-work-day') || '{}'); if (o.d === today()) day = o; } catch (e) {}
    day.ms += ms; try { localStorage.setItem('crab-work-day', JSON.stringify(day)); } catch (e) {}
    const m = ms / 60000, text = pickOne(SUM.find(([lim]) => m < lim)[1]);
    const dm = Math.round(day.ms / 60000), dayTxt = dm >= 60 ? `${Math.floor(dm / 60)} 小时 ${dm % 60} 分` : `${dm} 分钟`;
    const s = $('#wsum'); s.replaceChildren();
    const p1 = document.createElement('div'); p1.innerHTML = '这一段 <b></b>'; p1.querySelector('b').textContent = hms(ms);
    const p2 = document.createElement('div'); p2.textContent = text;
    const p3 = document.createElement('div'); p3.className = 'soft'; p3.textContent = (n ? `中间我摸了 ${n} 次鱼。` : '中间我一次鱼都没摸。') + `今天一共陪你干了 ${dayTxt}。`;
    s.append(p1, p2, p3); s.hidden = false; $('#wline').textContent = ''; $('#wtime').textContent = hms(ms); wbuttons();
  }
  function wTick() {
    if (!$('#wsum').hidden) return;
    $('#wtime').textContent = hms(welapsed());
    if (!W.run || wbusy) return;
    if (Date.now() > nextEvt) { moyu(pickOne(MOYU)); return; }
    if (Math.random() < 0.05 && !$('#wline').textContent) wline(pickOne(TYPE));
  }
  function openWork() {
    if (painting) stopPainting();
    hideInvite(); away = true; sheet.hidden = true; closet.hidden = true; work.hidden = false;
    work.classList.toggle('dark', shown === 'night');
    buildWorkCrab(); frontPeek(false); witem.hidden = true; $('#wsum').hidden = true; wbusy = false; wtok++;
    requestAnimationFrame(() => { drawWin(); rainStart(); });
    $('#wtime').textContent = hms(welapsed()); wbuttons();
    if (W.run) { wtype(true); nextEvt = Date.now() + rnd(10, 20) * 1000; wline('我一直在敲，你回来了。'); }
    else { wtype(false); wline(W.acc ? '暂停着呢。' : pickOne(['要开工吗。', '我把电脑打开了。'])); }
    clearInterval(wtick); wtick = setInterval(wTick, 1000);
  }
  // 干活的时候戳它：先抬头看你，再嫌你烦，戳多了整只贴到屏幕上
  let wpokes = 0, wpokeT = null;
  function wpoke() {
    if (pressing || !$('#wsum').hidden) return;
    wpokes++; clearTimeout(wpokeT); wpokeT = setTimeout(() => { wpokes = 0; }, 6000);
    if (wpokes >= 5) {
      wpokes = 0; wtype(false); wbusy = true; wcrab.style.visibility = 'hidden'; $('#whands').classList.add('hide');
      pressFace(pickOne(['到底干不干了？', '到底干不干了？', '你是来干活的还是来戳我的？']), { force: true, onEnd: (early) => {
        wbusy = false; wcrab.style.visibility = ''; $('#whands').classList.remove('hide'); if (W.run) wtype(true);
        wline(early ? pickOne(['……好，我回去敲。', '被你按回去了。']) : pickOne(['……好了，干活。', '我盯着你呢。', '屏幕上留了个印子，你自己擦。']));
      } });
      return;
    }
    if (wbusy) { wline(pickOne(['等一下，我在摸鱼。', '嘘。'])); return; }
    if (wpokes === 1) {
      wline(pickOne(['嗯？', '在呢。', '戳我干嘛。'])); weyes('translate(0 0)'); $('#whands').classList.remove('typing');
      setTimeout(() => { if (!wbusy && !pressing) { weyes('translate(0 0.45)'); if (W.run) $('#whands').classList.add('typing'); } }, 1300);
    } else {
      wcrab.classList.add('chomp'); setTimeout(() => wcrab.classList.remove('chomp'), 160);
      wline(wpokes === 4 ? pickOne(['再戳我就要过来了。', '最后警告。']) : pickOne(['别戳，在写。', '你戳我我就写错了。', '……手指拿开。', '再不跑通我就砸了，你也一起。']));
    }
  }
  $('#wcrab').addEventListener('click', wpoke); $('#wcrab').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); wpoke(); } }); $('#wlap').addEventListener('click', wpoke);
  pcbtn.addEventListener('click', openWork);
  $('#workback').addEventListener('click', () => {
    clearInterval(wtick); wtok++; wtype(false); rainStop(); leave(work); wbusy = false;
    if (W.run) say(pickOne(['你忙，我接着敲。', '计时还在走。']), 2400);
  });

  // ---------------- 开始 ----------------
  showPeriod(true);
  const [sx, sy] = pickOne(corners());
  crab.x = crab.tx = sx; crab.y = crab.ty = sy; setCrab();
  requestAnimationFrame(frame);
  hintT = setTimeout(() => { $('#hint').style.opacity = 0; }, 9000);
})();
</script>
</body>
</html>
