<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蟹壳克莱尔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* 布局：整屏一张莫奈式的画，随时间换；一只戴眼镜的像素螃蟹在画上爬，东西摆在画里，拖给它。只有一种样子，不跟主题走。 */
:root {
  --paper: #fbf7f0;
  --ink: #2a2522;
  --soft: #6d6460;
  --shell: #d97757;
  --edge: rgba(42, 37, 34, 0.18);
  --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden;
  background: #cfd6ea; color: var(--ink);
  font-family: var(--serif); font-size: 16px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
.bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; transition: opacity 3s ease; }
#bgB { opacity: 0; }
#clock {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; z-index: 5;
  font: inherit; font-size: 14px; letter-spacing: 0.12em;
  color: var(--ink); background: rgba(251, 247, 240, 0.72);
  border: 1px solid var(--edge); border-radius: 999px;
  padding: 5px 14px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
#clock:focus-visible, .item:focus-visible, #crab:focus-visible { outline: 2px solid var(--shell); outline-offset: 3px; }
#crab {
  position: fixed; left: 0; top: 0; z-index: 3;
  width: 108px; height: 79px; margin: -60px 0 0 -54px;
  background: none; border: 0; padding: 0; cursor: pointer;
  touch-action: none;
}
#crab svg { width: 100%; height: 100%; overflow: visible; display: block; }
#crab .grin, #crab .up { display: none; }
#crab.happy .eye, #crab.happy .down { display: none; }
#crab.happy .grin, #crab.happy .up { display: block; }
#crab .eye { transition: transform 0.12s linear; }
#crab.walk.s1 .l1, #crab.walk.s2 .l2 { transform: translateY(-0.7px); }
#crab.munch .up { transform: translateY(1px); }
#crab svg { transition: transform 0.25s ease; }
#crab.lifted svg { transform: scale(1.08) rotate(-5deg); filter: drop-shadow(0 14px 6px rgba(42, 37, 34, 0.22)); }
#crab.lifted.s1 .l1, #crab.lifted.s2 .l2 { transform: translateY(-0.7px); }
.item {
  position: fixed; left: 0; top: 0; z-index: 2;
  background: none; border: 0; padding: 6px; margin: 0; cursor: grab;
  touch-action: none; transition: opacity 0.6s ease;
  filter: drop-shadow(0 3px 0 rgba(42, 37, 34, 0.18));
}
.item svg { display: block; overflow: visible; }
.item.drag { cursor: grabbing; z-index: 4; filter: drop-shadow(0 8px 2px rgba(42, 37, 34, 0.22)); }
.item.gone { opacity: 0; pointer-events: none; }
#bubble {
  position: fixed; left: 0; top: 0; z-index: 4;
  max-width: min(15em, 70vw);
  background: var(--paper); color: var(--ink);
  border: 1px solid var(--edge); border-radius: 14px;
  padding: 7px 13px; font-size: 15px;
  transform: translate(-50%, -100%);
  opacity: 0; transition: opacity 0.5s ease;
  pointer-events: none; text-wrap: pretty;
}
#bubble.on { opacity: 1; }
#bubble::after {
  content: ""; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px;
  background: var(--paper); border-right: 1px solid var(--edge); border-bottom: 1px solid var(--edge);
  transform: translateX(-50%) rotate(45deg);
}
#hint {
  position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 1;
  text-align: center; font-size: 13px; letter-spacing: 0.1em; color: rgba(42, 37, 34, 0.55);
  transition: opacity 2s ease;
}
body.night #hint { color: rgba(232, 236, 246, 0.55); }
#crab .flag { display: none; }
body.five #crab .flag, body.five #crab .up { display: block; }
body.five #crab .down { display: none; }
#mailbox {
  position: fixed; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  background: none; border: 0; padding: 6px; cursor: pointer;
  filter: drop-shadow(0 3px 0 rgba(42, 37, 34, 0.18));
}
#mailbox svg { display: block; }
#mailbox .dot { position: absolute; top: 2px; right: 2px; width: 9px; height: 9px; border-radius: 50%; background: var(--shell); border: 2px solid var(--paper); }
#sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  max-height: 78vh; display: flex; flex-direction: column; gap: 12px;
  background: var(--paper); color: var(--ink);
  border-top: 1px solid var(--edge); border-radius: 18px 18px 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 40px rgba(42, 37, 34, 0.16);
  user-select: text; -webkit-user-select: text;
}
#sheet header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
#sheet h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.1em; }
#sheet .close { font: inherit; font-size: 14px; color: var(--soft); background: none; border: 0; cursor: pointer; padding: 4px; }
#notes { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; flex: 1 1 auto; max-width: 36em; width: 100%; margin: 0 auto; }
#notes .empty { color: var(--soft); font-size: 14px; }
.note { max-width: 82%; padding: 8px 12px; border-radius: 12px; font-size: 15px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.note.mine { align-self: flex-end; background: #efe6da; }
.note.crab { align-self: flex-start; background: #f6e0d6; }
.note .meta { display: block; margin-top: 4px; font-size: 12px; color: var(--soft); letter-spacing: 0.06em; }
#form { display: grid; grid-template-columns: 1fr; gap: 8px; max-width: 36em; width: 100%; margin: 0 auto; }
#form textarea { grid-column: 1 / -1; min-height: 4.6em; resize: vertical; }
#form textarea, #form input {
  font: inherit; font-size: 16px; color: var(--ink); background: #fffdf9;
  border: 1px solid var(--edge); border-radius: 10px; padding: 8px 10px; min-width: 0;
}
#form button { justify-self: end; font: inherit; font-size: 15px; letter-spacing: 0.12em; color: var(--paper); background: var(--shell); border: 0; border-radius: 10px; padding: 8px 16px; cursor: pointer; }
#form button:disabled { opacity: 0.5; cursor: default; }
#formmsg { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--soft); min-height: 1.2em; }
#mailbox:focus-visible, #sheet button:focus-visible, #form textarea:focus-visible, #form input:focus-visible { outline: 2px solid var(--shell); outline-offset: 2px; }
#crab .acc { display: none; }
#crab.w-sci .sci, #crab.w-cowboy .cowboy, #crab.w-wizard .wizard, #crab.w-shades .shades,
#crab.w-sci .up, #crab.w-wizard .up { display: block; }
#crab.w-sci .down, #crab.w-wizard .down, #crab.w-shades .eye, #crab.w-shades .glasses, #crab.w-shades .grin { display: none !important; }
#closet h2 { cursor: default; user-select: none; -webkit-user-select: none; }
#crab.w-straw .straw, #crab.w-beret .beret, #crab.w-crown .crown, #crab.w-lily .lily, #crab.w-phones .phones, #crab.w-bow .bow { display: block; }
#closetbtn {
  position: fixed; left: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  background: none; border: 0; padding: 6px; cursor: pointer;
  filter: drop-shadow(0 3px 0 rgba(42, 37, 34, 0.18));
}
#closetbtn svg { display: block; }
#closet {
  position: fixed; left: 0; right: 0; top: 0; z-index: 6;
  display: flex; flex-direction: column; gap: 10px;
  background: var(--paper); color: var(--ink);
  border-bottom: 1px solid var(--edge); border-radius: 0 0 18px 18px;
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 16px;
  box-shadow: 0 10px 40px rgba(42, 37, 34, 0.16);
}
#closet header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; max-width: 36em; width: 100%; margin: 0 auto; }
#closet h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.1em; }
#closet .close { font: inherit; font-size: 14px; color: var(--soft); background: none; border: 0; cursor: pointer; padding: 4px; }
#closet .row { display: flex; flex-wrap: wrap; gap: 8px; max-width: 36em; width: 100%; margin: 0 auto; }
#closet .label { max-width: 36em; width: 100%; margin: 0 auto; font-size: 13px; color: var(--soft); letter-spacing: 0.1em; }
#closet .row button {
  font: inherit; font-size: 15px; color: var(--ink); background: #fffdf9;
  border: 1px solid var(--edge); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
#closet .row button[aria-pressed="true"] { background: var(--shell); border-color: var(--shell); color: var(--paper); }
#closetbtn:focus-visible, #closet button:focus-visible { outline: 2px solid var(--shell); outline-offset: 2px; }
#crab .letter { display: none; }
#crab.mail .letter, #crab.mail .up { display: block; }
#crab.mail .down { display: none; }
#crab.bare .glasses { display: none; }
#crab.swim svg { animation: bob 0.9s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(5px) rotate(2deg); } }
.fx { position: fixed; left: 0; top: 0; z-index: 3; pointer-events: none; }
.bubbleup { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid rgba(251, 247, 240, 0.85); animation: up 1.6s ease-out forwards; }
@keyframes up { to { transform: translate(var(--dx), -70px); opacity: 0; } }
.fall { animation: fall 1.1s cubic-bezier(.5, 0, .9, .5) forwards; }
@keyframes fall { to { transform: translate(var(--dx), 46px) rotate(160deg); opacity: 0.9; } }
#easel { position: fixed; left: 0; top: 0; z-index: 2; pointer-events: none; transition: opacity 0.8s ease; filter: drop-shadow(0 3px 0 rgba(42, 37, 34, 0.18)); }
#crab .bump { display: none; }
#crab.dizzy .bump { display: block; }
#crab.dizzy .glasses { transform: rotate(-14deg); transform-box: fill-box; transform-origin: center; }
#crab.bonk svg { animation: bonk 0.55s ease-out; }
@keyframes bonk { 20% { transform: scale(1.15, 0.72); } 45% { transform: scale(0.94, 1.08) rotate(-6deg); } 70% { transform: rotate(4deg); } }
#fist {
  position: fixed; left: 0; top: 0; z-index: 4; margin: -26px 0 0 -26px;
  background: none; border: 0; padding: 6px; cursor: pointer;
  filter: drop-shadow(0 3px 0 rgba(42, 37, 34, 0.18));
  animation: fistin 0.3s ease-out, wiggle 0.6s ease-in-out 0.3s infinite;
}
#fist[hidden] { display: none; }
#fist svg { display: block; }
#fist:focus-visible { outline: 2px solid var(--shell); outline-offset: 2px; }
@keyframes fistin { from { opacity: 0; scale: 0.3; } }
@keyframes wiggle { 50% { rotate: -12deg; } }
@media (prefers-reduced-motion: reduce) { .bg, #bubble, .item { transition: none; } #crab.swim svg, .bubbleup, .fall, #crab.bonk svg, #fist { animation: none; } }
</style>
</head>
<body>

<canvas id="bgA" class="bg" aria-hidden="true"></canvas>
<canvas id="bgB" class="bg" aria-hidden="true"></canvas>
<button id="clock" type="button" aria-label="现在的时段，点一下预览别的时段"></button>
<button id="crab" type="button" aria-label="螃蟹">
  <svg viewBox="-7.5 -10.5 15 11" shape-rendering="crispEdges" aria-hidden="true">
    <g fill="#1c1a19"><rect x="-6.17" y="-9.17" width="12.34" height="7.34"/><rect x="-7.17" y="-7.17" width="1.34" height="2.34"/><rect class="down" x="5.83" y="-7.17" width="1.34" height="2.34"/><rect class="up" x="5.83" y="-10.17" width="1.34" height="3.34"/><rect class="l1" x="-5.17" y="-2.17" width="1.34" height="2.34"/><rect class="l2" x="-2.17" y="-2.17" width="1.34" height="2.34"/><rect class="l1" x="0.83" y="-2.17" width="1.34" height="2.34"/><rect class="l2" x="3.83" y="-2.17" width="1.34" height="2.34"/></g>
    <g fill="#d97757"><rect x="-6" y="-9" width="12" height="7"/><rect x="-7" y="-7" width="1" height="2"/><rect class="down" x="6" y="-7" width="1" height="2"/><rect class="up" x="6" y="-10" width="1" height="3"/><rect class="l1" x="-5" y="-2" width="1" height="2"/><rect class="l2" x="-2" y="-2" width="1" height="2"/><rect class="l1" x="1" y="-2" width="1" height="2"/><rect class="l2" x="4" y="-2" width="1" height="2"/></g>
    <g class="eye" fill="#1c1a19"><rect x="-3.5" y="-7.5" width="1" height="2"/><rect x="2.5" y="-7.5" width="1" height="2"/></g>
    <g class="grin" fill="#1c1a19"><rect x="-3.75" y="-6.5" width=".5" height=".5"/><rect x="-3.25" y="-7" width=".5" height=".5"/><rect x="-2.75" y="-6.5" width=".5" height=".5"/><rect x="2.25" y="-6.5" width=".5" height=".5"/><rect x="2.75" y="-7" width=".5" height=".5"/><rect x="3.25" y="-6.5" width=".5" height=".5"/></g>
    <g class="acc bow"><rect x="-1.8" y="-3.7" width="1.3" height="1.4" fill="#d9534f"/><rect x="0.5" y="-3.7" width="1.3" height="1.4" fill="#d9534f"/><rect x="-0.5" y="-3.4" width="1" height=".8" fill="#a83b38"/></g>
    <g class="acc straw"><rect x="-3" y="-11.4" width="6" height="2" fill="#e8c56a"/><rect x="-3" y="-10.1" width="6" height=".5" fill="#c0504d"/><rect x="-5.2" y="-9.6" width="10.4" height=".75" fill="#d9b456"/></g>
    <g class="acc beret"><rect x="-4.2" y="-10.5" width="7.4" height="1.6" fill="#2f3b5c"/><rect x="2.6" y="-10.1" width="1.6" height="1" fill="#2f3b5c"/><rect x="-0.4" y="-11.1" width=".6" height=".7" fill="#2f3b5c"/></g>
    <g class="acc crown"><rect x="-2.5" y="-10.3" width="5" height="1.3" fill="#f2c14e"/><rect x="-2.5" y="-11.3" width="1" height="1" fill="#f2c14e"/><rect x="-0.5" y="-11.6" width="1" height="1.3" fill="#f2c14e"/><rect x="1.5" y="-11.3" width="1" height="1" fill="#f2c14e"/><rect x="-0.2" y="-10" width=".45" height=".45" fill="#d9534f"/></g>
    <g class="acc lily"><rect x="1.7" y="-9.35" width="1.1" height=".45" fill="#6aa84f"/><rect x="2.8" y="-10.3" width=".6" height=".6" fill="#f2a6bd"/><rect x="2.2" y="-9.7" width=".6" height=".6" fill="#f2a6bd"/><rect x="3.4" y="-9.7" width=".6" height=".6" fill="#f2a6bd"/><rect x="2.8" y="-9.7" width=".6" height=".6" fill="#f6d55c"/></g>
    <g class="acc phones"><rect x="-5.2" y="-10.4" width="10.4" height=".55" fill="#22243a"/><rect x="-5.6" y="-10.2" width=".55" height="1.4" fill="#22243a"/><rect x="5.05" y="-10.2" width=".55" height="1.4" fill="#22243a"/><rect x="-6.5" y="-8.9" width="1.3" height="2.3" fill="#e0566b"/><rect x="5.2" y="-8.9" width="1.3" height="2.3" fill="#e0566b"/></g>
    <g class="acc sci"><rect x="-6.2" y="-9.95" width="12.4" height=".55" fill="#3a3a3a"/><rect x="-4.8" y="-10.9" width="9.6" height="2.1" fill="#3a3a3a"/><rect x="-4.4" y="-10.55" width="8.8" height="1.4" fill="#b9c8d4"/><rect x="-3.8" y="-10.35" width="1.2" height=".45" fill="#eef4f8"/><rect x="6.85" y="-12.2" width=".7" height="1.2" fill="#d6eef6"/><rect x="6.3" y="-11.1" width="1.8" height="1.4" fill="#5ec4e8"/><rect x="6.5" y="-10.9" width=".4" height=".4" fill="#e9f8fd"/></g>
    <g class="acc cowboy"><rect x="-3.4" y="-12.2" width="6.8" height="2.6" fill="#8a5a3c"/><rect x="-1" y="-12.4" width="2" height=".5" fill="#7a4e33"/><rect x="-3.4" y="-10.6" width="6.8" height=".55" fill="#5a3a26"/><rect x="-6.6" y="-10" width="13.2" height=".9" fill="#7a4e33"/><rect x="-6.6" y="-10.5" width=".9" height=".6" fill="#7a4e33"/><rect x="5.7" y="-10.5" width=".9" height=".6" fill="#7a4e33"/></g>
    <g class="acc wizard"><rect x="-5.6" y="-9.6" width="11.2" height=".75" fill="#2f4fa8"/><rect x="-4" y="-10.6" width="8" height="1.1" fill="#3a5fc4"/><rect x="-3" y="-11.6" width="6" height="1.1" fill="#3a5fc4"/><rect x="-2" y="-12.6" width="4" height="1.1" fill="#3a5fc4"/><rect x="-1.3" y="-13.6" width="2.6" height="1.1" fill="#3a5fc4"/><rect x="-0.2" y="-14.3" width="1.6" height=".8" fill="#3a5fc4"/><rect x="-2.8" y="-10.3" width=".45" height=".45" fill="#f6d55c"/><rect x="1.4" y="-11.2" width=".45" height=".45" fill="#f6d55c"/><rect x="-1" y="-12.3" width=".45" height=".45" fill="#f6d55c"/><rect x="2.6" y="-10.1" width=".45" height=".45" fill="#f6d55c"/><rect x="6.45" y="-13.2" width=".3" height="3.2" fill="#6b4a35"/><rect x="6.05" y="-14.2" width="1.1" height="1.1" fill="#f6d55c"/><rect x="5.75" y="-13.9" width="1.7" height=".5" fill="#f6d55c"/></g>
    <g class="acc shades"><rect x="-4.7" y="-8.2" width="3.7" height="2.1" fill="#111"/><rect x="1" y="-8.2" width="3.7" height="2.1" fill="#111"/><rect x="-1.1" y="-7.8" width="2.2" height=".45" fill="#111"/><rect x="-4.3" y="-7.9" width=".6" height=".4" fill="#f4f4f2"/><rect x="1.4" y="-7.9" width=".6" height=".4" fill="#f4f4f2"/></g>
    <g class="letter"><rect x="5.1" y="-12.6" width="3.2" height="2.2" fill="#fbf7f0" stroke="#1c1a19" stroke-width=".15"/><path d="M5.1 -12.6L6.7 -11.4L8.3 -12.6" fill="none" stroke="#1c1a19" stroke-width=".15"/></g>
    <g class="flag"><rect x="6.35" y="-14.6" width=".3" height="4.8" fill="#1c1a19"/><rect x="6.65" y="-14.6" width="2.6" height="1.8" fill="#fbf7f0" stroke="#1c1a19" stroke-width=".15"/></g>
    <g class="bump" fill="#f2a6bd"><rect x="-1" y="-10.4" width="2" height="1.5"/><rect x="-0.6" y="-10.9" width="1.2" height=".6"/></g>
    <g class="glasses" fill="none" stroke="#e6ecf2" stroke-width=".2"><rect x="-4.3" y="-8.2" width="2.6" height="2.6"/><rect x="1.7" y="-8.2" width="2.6" height="2.6"/><path d="M-1.7 -7H1.7"/></g>
  </svg>
</button>
<div id="bubble" role="status" aria-live="polite"></div>
<button id="fist" type="button" aria-label="打它" hidden></button>
<div id="easel" hidden></div>
<div id="hint">点螃蟹，或者把东西拖给它</div>
<button id="mailbox" type="button" aria-label="信箱" hidden></button>
<button id="closetbtn" type="button" aria-label="衣柜"></button>
<section id="closet" aria-label="衣柜" hidden>
  <header><h2>衣柜</h2><button class="close" type="button" id="closetclose">关上</button></header>
  <p class="label">头上</p>
  <div class="row" id="rowhead"></div>
  <p class="label">脖子上</p>
  <div class="row" id="rowneck"></div>
  <p class="label" id="joblabel" hidden>柜子最里面</p>
  <div class="row" id="rowjob" hidden></div>
</section>
<section id="sheet" aria-label="信箱" hidden>
  <header><h2>信箱</h2><button class="close" type="button" id="sheetclose">收起</button></header>
  <div id="notes"></div>
  <form id="form">
    <textarea id="notetext" maxlength="500" placeholder="想说什么，写在这儿" aria-label="纸条内容"></textarea>
    <button type="submit" id="notesend">塞进去</button>
    <p id="formmsg" role="status"></p>
  </form>
</section>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const BANK = 0.66;                    // 岸的上沿，占画面高度的比例；岸以上、地平线以下是水
  const CY = () => innerHeight * 0.74;  // 螃蟹平时站在岸上
  const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];
  function picker(arr) { let last = -1; return () => { let i; do { i = Math.floor(Math.random() * arr.length); } while (arr.length > 1 && i === last); last = i; return arr[i]; }; }

  // ---------------- 时段 ----------------
  const PERIODS = ['morning', 'noon', 'evening', 'night'];
  const NAMES = { morning: '清晨', noon: '正午', evening: '傍晚', night: '夜里' };
  const byHour = (h) => (h >= 5 && h < 10) ? 'morning' : (h >= 10 && h < 15) ? 'noon' : (h >= 15 && h < 19) ? 'evening' : 'night';
  let manual = null;
  const period = () => manual || byHour(new Date().getHours());

  // ---------------- 莫奈式的画：一笔一笔点出来，画好就不动 ----------------
  const PAL = {
    morning: { bank: ['#c9c79a', '#b9c48e', '#e2cfa8', '#a9b98a', '#d8d0b0'], sky: ['#e9d3e2', '#f4d9d1', '#f6e4c8', '#dfe3ee', '#cfd9ea'], water: ['#c9d3e4', '#e3cdd8', '#b7c7dc', '#efd9cc', '#c6d6dc'], sun: { x: 0.7, y: 0.32, r: 0.045, c: '#fbe3bd', g: '#f6caa0' }, hz: 0.47 },

  };
  function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function mix(a, b, t) { return a.map((v, i) => Math.round(v + (b[i] - v) * t)); }
  function css(c, a = 1) { return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
  function band(list, t) { const L = list.map(hex); const x = Math.max(0, Math.min(0.999, t)) * (L.length - 1); const i = Math.floor(x); return mix(L[i], L[Math.min(i + 1, L.length - 1)], x - i); }

  function paint(cv, p) {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = innerWidth, h = innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const P = PAL[p], hz = P.hz * h;
    let g = c.createLinearGradient(0, 0, 0, hz);
    P.sky.forEach((col, i) => g.addColorStop(i / (P.sky.length - 1), col));
    c.fillStyle = g; c.fillRect(0, 0, w, hz);
    g = c.createLinearGradient(0, hz, 0, h);
    P.water.forEach((col, i) => g.addColorStop(i / (P.water.length - 1), col));
    c.fillStyle = g; c.fillRect(0, hz, w, h - hz);

    const sun = { x: P.sun.x * w, y: P.sun.y * h, r: P.sun.r * Math.max(w, h) };
    g = c.createRadialGradient(sun.x, sun.y, 0, sun.x, sun.y, sun.r * 6);
    g.addColorStop(0, css(hex(P.sun.g), 0.55)); g.addColorStop(1, css(hex(P.sun.g), 0));
    c.fillStyle = g; c.fillRect(0, 0, w, hz);

    const dab = (x, y, len, thick, ang, col, a) => {
      c.save(); c.translate(x, y); c.rotate(ang); c.globalAlpha = a; c.fillStyle = col;
      c.beginPath(); c.ellipse(0, 0, len / 2, thick / 2, 0, 0, Math.PI * 2); c.fill(); c.restore();
    };
    const N = Math.floor(w * h / 70);
    for (let i = 0; i < N; i++) {
      const y = Math.random() * h;
      if (y < hz) {
        const t = y / hz + rnd(-0.12, 0.12);
        dab(Math.random() * w, y, rnd(8, 24), rnd(3, 8), rnd(-0.5, 0.5), css(band(P.sky, t)), rnd(0.45, 0.85));
      } else {
        const t = (y - hz) / (h - hz);
        let col = band(P.water, t + rnd(-0.1, 0.1));
        if (Math.random() < 0.35) col = mix(band(P.sky, 1 - t * 0.9 + rnd(-0.1, 0.1)), [20, 24, 50], 0.15);
        dab(Math.random() * w, y, rnd(10, 30) * (0.6 + t), rnd(2, 5) * (0.7 + t), rnd(-0.1, 0.1), css(col), rnd(0.5, 0.9));
      }
    }
    // 太阳 / 月亮：几笔点出来，水里拖一道碎的倒影
    for (let i = 0; i < 90; i++) {
      const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * sun.r;
      dab(sun.x + Math.cos(a) * r, sun.y + Math.sin(a) * r, rnd(4, 10), rnd(2, 5), rnd(-0.6, 0.6), P.sun.c, rnd(0.6, 0.95));
    }
    const refl = mix(hex(P.sun.c), hex(P.sun.g), 0.3);
    for (let i = 0; i < 160; i++) {
      const t = Math.pow(Math.random(), 1.4), y = hz + t * (h - hz) * 0.9 + 4;
      const spread = sun.r * (0.6 + t * 3);
      dab(sun.x + rnd(-spread, spread), y, rnd(8, 22) * (1 + t), rnd(2, 4), rnd(-0.05, 0.05), css(refl), (1 - t) * rnd(0.4, 0.85));
    }
    if (P.lilies) {
      const pads = ['#5f8f4e', '#7fae6a', '#4a7a5a', '#93b979'];
      for (let k = 0; k < 16; k++) {
        const cx = Math.random() * w, cy = hz + (0.15 + Math.random() * 0.75) * (BANK * h - hz), s = 0.5 + (cy - hz) / (h - hz);
        for (let i = 0; i < 9; i++) dab(cx + rnd(-26, 26) * s, cy + rnd(-6, 6) * s, rnd(14, 26) * s, rnd(5, 9) * s, rnd(-0.2, 0.2), pickOne(pads), rnd(0.7, 0.95));
        if (Math.random() < 0.6) for (let i = 0; i < 4; i++) dab(cx + rnd(-10, 10) * s, cy + rnd(-4, 2) * s, rnd(4, 7) * s, rnd(3, 5) * s, rnd(-0.6, 0.6), pickOne(['#f2a6bd', '#f7d0dc', '#ffffff']), 0.9);
      }
    }
    if (P.lamps) {
      for (let k = 0; k < 22; k++) {
        const x = Math.random() * w, y = hz - rnd(2, 10);
        dab(x, y, rnd(3, 5), rnd(3, 5), 0, '#ffcf8a', 0.95);
        for (let i = 0; i < 6; i++) dab(x + rnd(-3, 3), hz + 6 + i * rnd(6, 12), rnd(6, 12), 2, 0, '#ffcf8a', 0.5 - i * 0.07);
      }
    }
    // 近处的岸：螃蟹和东西都放在这上面，再往上才是水
    const by = BANK * h;
    c.globalAlpha = 1;
    c.beginPath(); c.moveTo(0, h); c.lineTo(0, by + 6);
    for (let x = 0; x <= w + 20; x += 20) c.lineTo(x, by + Math.sin(x * 0.021) * 6 + Math.sin(x * 0.007 + 1.3) * 9);
    c.lineTo(w, h); c.closePath();
    g = c.createLinearGradient(0, by, 0, h);
    P.bank.forEach((col, i) => g.addColorStop(i / (P.bank.length - 1), col));
    c.fillStyle = g; c.fill();
    const nb = Math.floor(w * (h - by) / 60);
    for (let i = 0; i < nb; i++) {
      const x = Math.random() * w, t = Math.random(), y = by + 4 + t * (h - by);
      dab(x, y, rnd(8, 20) * (0.7 + t), rnd(3, 6) * (0.7 + t), rnd(-0.6, 0.6), pickOne(P.bank), rnd(0.5, 0.9));
    }
    // 岸边一排草，往上挑
    for (let i = 0; i < w / 5; i++) {
      const x = Math.random() * w, y = by + Math.sin(x * 0.021) * 6 + Math.sin(x * 0.007 + 1.3) * 9 + rnd(-2, 6);
      dab(x, y - rnd(4, 10), rnd(10, 18), rnd(2, 3), -Math.PI / 2 + rnd(-0.4, 0.4), pickOne(P.bank), rnd(0.6, 0.9));
    }
    // 画布纹
    c.globalAlpha = 1;
    const tex = c.createImageData(cv.width, cv.height);
    for (let i = 0; i < tex.data.length; i += 4) { const v = Math.random() * 255; tex.data[i] = tex.data[i + 1] = tex.data[i + 2] = v; tex.data[i + 3] = 14; }
    const tc = document.createElement('canvas'); tc.width = cv.width; tc.height = cv.height; tc.getContext('2d').putImageData(tex, 0, 0);

  }

    clearTimeout(kefuT); fist.hidden = true; idleT = 0;
    crabEl.classList.remove('bonk'); void crabEl.offsetWidth; crabEl.classList.add('bonk', 'dizzy');
    setTimeout(() => crabEl.classList.remove('bonk'), 600);
    setTimeout(() => crabEl.classList.remove('dizzy'), 4000);
    say(OUCH(), 2600);
  });

  // 长按把它拎起来，拖到哪儿放哪儿
  const LIFT = picker(['喂！', '放我下来……', '举高高？', '你要把我带去哪儿。']);
  const DROP = picker(['站稳了。', '下次提前说一声。', '……这儿也行。', '腿还在晃。']);
  let lifting = false, liftTimer = null, suppressClick = false, lsx = 0, lsy = 0;
  crabEl.addEventListener('pointerdown', (e) => {
    if (busy) return;
    lsx = e.clientX; lsy = e.clientY;
    try { crabEl.setPointerCapture(e.pointerId); } catch (err) {}
    clearTimeout(liftTimer);
    liftTimer = setTimeout(() => {
      lifting = true; crabEl.classList.add('lifted');
      crab.tx = crab.x; crab.ty = crab.y; crab.onArrive = null;
      say(LIFT(), 1800);
    }, 420);
  });
  crabEl.addEventListener('pointermove', (e) => {
    if (!lifting) { if (Math.hypot(e.clientX - lsx, e.clientY - lsy) > 10) clearTimeout(liftTimer); return; }
    crab.x = crab.tx = Math.max(20, Math.min(innerWidth - 20, e.clientX));
    crab.y = crab.ty = Math.max(90, Math.min(innerHeight + 10, e.clientY + 34));
  });
  const liftEnd = () => {
    clearTimeout(liftTimer);
    if (!lifting) return;
    lifting = false; suppressClick = true; idleT = 0;
    crabEl.classList.remove('lifted', 's1', 's2');
    const hzY = PAL[shown].hz * innerHeight, bankY = BANK * innerHeight;
    if (crab.y < hzY) return fallIn(hzY, bankY);   // 扔到天上：先掉下来
    if (crab.y < bankY - 4) return swim();
    say(DROP(), 1800);
  };
  crabEl.addEventListener('pointerup', liftEnd);
  crabEl.addEventListener('pointercancel', liftEnd);
  crabEl.addEventListener('contextmenu', (e) => e.preventDefault());

  let lastTap = 0;
  crabEl.addEventListener('click', () => {
    if (suppressClick) { suppressClick = false; return; }
    idleT = 0;
    if (painting) stopPainting();
    if (held) { putDown(); return; }
    if (busy) return;
    if (hasUnread && Math.hypot(crab.x - MAILSPOT()[0], crab.y - MAILSPOT()[1]) < 40) { say('给你的。', 1800); openSheet(); return; }
    const now = performance.now();
    if (atCenter() && now - lastTap < 320) { lastTap = 0; glassesOff(); return; }
    lastTap = now;
    if (!atCenter()) {
      say(PEEK(), 1800);
      walkTo(innerWidth / 2, CY(), () => say(GREET[shown]()));
      return;
    }
    pokes++; clearTimeout(pokeReset); pokeReset = setTimeout(() => { pokes = 0; }, 20000);
    if (document.body.classList.contains('five')) { happy(); return; } // 五点举白旗的时候，一句话都不说
    if (fist.hidden && (kefuSeen ? pokes > 4 && Math.random() < 0.1 : pokes === 6)) { kefu(); return; }
    happy();
    say(pokes <= 3 ? POKE1() : pokes <= 8 ? POKE2() : POKE3());
  });

  // ---------------- 递东西 ----------------
  function give(o) {
    const it = ITEMS[o.key];
    busy = true;
    if (!atCenter() && Math.hypot(o.x - crab.x, o.y - crab.y) > 90) { busy = false; return; }
    if (it.ball) return dribble(o, it);
    if (it.hold) return hold(o, it);
    // 吃掉 / 喝掉
    o.x = crab.x + 30; o.y = crab.y - 40; place(o);
    happy(2200);
    let n = 0; const m = setInterval(() => { crabEl.classList.toggle('munch'); if (++n > 7) { clearInterval(m); crabEl.classList.remove('munch'); } }, 180);
    say(pickOne(it.say));
    setTimeout(() => { o.el.classList.add('gone'); }, 900);
    setTimeout(() => { o.el.remove(); items = items.filter(i => i !== o); busy = false; respawn(o.key); }, 1600);
  }
  function respawn(key) {
    const p = shown;
    setTimeout(() => {
      if (shown !== p || items.some(i => i.key === key)) return;
      const o = addItem(key, rnd(0.15, 0.85) * innerWidth, rnd(0.72, 0.9) * innerHeight);
      o.el.classList.add('gone'); requestAnimationFrame(() => o.el.classList.remove('gone'));
    }, 40000);
  }
  function dribble(o, it) {
    happy(3000); say(pickOne(it.say), 3000);
    const bx = crab.x + 36, base = crab.y - 30; let t0 = performance.now();
    const fly = (now) => {
      const t = (now - t0) / 1000;
      if (t < 2.2 && !reduce) { o.x = bx; o.y = base - Math.abs(Math.sin(t * Math.PI * 2.2)) * 70; place(o); requestAnimationFrame(fly); }
      else { o.x = crab.x + rnd(90, 140) * (Math.random() < 0.5 ? -1 : 1); o.y = Math.min(innerHeight - 40, crab.y + rnd(20, 60)); place(o); busy = false; }
    };
    requestAnimationFrame(fly);
  }
  function hold(o, it) {
    held = o; busy = false;
    o.el.style.pointerEvents = 'none';
    say(pickOne(it.say), 3000);
    eye.setAttribute('transform', 'translate(0 0.45)');
  }
  function putDown() {
    const o = held; held = null;
    o.el.style.pointerEvents = '';
    o.x = Math.max(40, Math.min(innerWidth - 40, crab.x + (crab.x > innerWidth / 2 ? -110 : 110)));
    o.y = Math.max(80, Math.min(innerHeight - 40, crab.y + 10)); place(o);
    happy(); say('好吧，陪你。');
  }

  // ---------------- 每一帧 ----------------
  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    const dx = crab.tx - crab.x, dy = crab.ty - crab.y, d = Math.hypot(dx, dy);
    if (d > 1.5) {
      const v = Math.min(d, 160 * dt);
      crab.x += dx / d * v; crab.y += dy / d * v;
      crabEl.classList.add('walk');
      crab.stepT += dt; if (crab.stepT > 0.12) { crab.stepT = 0; crab.step ^= 1; crabEl.classList.toggle('s1', crab.step === 0); crabEl.classList.toggle('s2', crab.step === 1); }
    } else if (crabEl.classList.contains('walk')) {
      crabEl.classList.remove('walk', 's1', 's2');
      const f = crab.onArrive; crab.onArrive = null; if (f) f();
    }
    if (lifting) { crab.stepT += dt; if (crab.stepT > 0.09) { crab.stepT = 0; crab.step ^= 1; crabEl.classList.toggle('s1', crab.step === 0); crabEl.classList.toggle('s2', crab.step === 1); } idleT = 0; }
    if (held) { held.x = crab.x + 4; held.y = crab.y - 22; place(held); }
    setCrab();
    // 闲着太久，就溜去别的角落探头
    idleT += dt;
    if (hasUnread && !busy && !held && !lifting && !painting && d < 2 && idleT > 3 && Math.hypot(crab.x - MAILSPOT()[0], crab.y - MAILSPOT()[1]) > 30) {
      idleT = 0; crabEl.classList.add('mail'); walkTo(...MAILSPOT());
    }
    if (!hasUnread) crabEl.classList.remove('mail');
    if (idleT > 20 && !busy && !held && !lifting && !painting && !hasUnread && d < 2) {
      idleT = 0;
      if (nextIdle === 'paint') { nextIdle = 'hide'; startPainting(); } else { nextIdle = 'paint'; hide(); }
    }
    requestAnimationFrame(frame);
  }

  // ---------------- 信箱：只有页面主人写得进去，纸条我在这边读得到 ----------------
  const MAILBOX = { s: 4, grid: ['........ff', '.bbbbbbbff', 'bbbbbbbbf.', 'bddddddbf.', 'bbbbbbbbf.', 'bbbbbbbb..', '...pp.....', '...pp.....', '...pp.....', '..pppp....'], col: { b: '#4f7f9a', d: '#1f2f3a', f: '#d9534f', p: '#6b4a35' } };
  const mb = $('#mailbox'), sheet = $('#sheet'), notesEl = $('#notes'), form = $('#form');
  mb.innerHTML = pixSVG(MAILBOX);
  let db = null, notes = [], replies = [], seenAt = '';
  try { seenAt = localStorage.getItem('crab-seen') || ''; } catch (e) {}
  const fmt = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  function renderNotes() {
    const all = [...notes.map(n => ({ ...n, who: 'mine' })), ...replies.map(r => ({ ...r, who: 'crab' }))].sort((a, b) => String(a.at).localeCompare(String(b.at)));
    notesEl.innerHTML = '';
    if (!all.length) { const p = document.createElement('p'); p.className = 'empty'; p.textContent = '还没有纸条。写一张，螃蟹会叼进去。'; notesEl.appendChild(p); }
    all.forEach(n => {
      const div = document.createElement('div'); div.className = 'note ' + n.who;
      div.textContent = String(n.text || '');
      const meta = document.createElement('span'); meta.className = 'meta';
      meta.textContent = (n.who === 'crab' ? '螃蟹' : '你') + ' · ' + fmt(n.at);
      div.appendChild(meta); notesEl.appendChild(div);
    });
    notesEl.scrollTop = notesEl.scrollHeight;
    const latest = replies.length ? String(replies[replies.length - 1].at) : '';
    mb.querySelector('.dot')?.remove();
    hasUnread = !!(latest && latest > seenAt);
    if (hasUnread && sheet.hidden) { const dot = document.createElement('span'); dot.className = 'dot'; mb.appendChild(dot); }
  }
  function openSheet() {
    $('#closet').hidden = true;
    sheet.hidden = false; renderNotes();
    const latest = replies.length ? String(replies[replies.length - 1].at) : '';
    if (latest) { seenAt = latest; try { localStorage.setItem('crab-seen', latest); } catch (e) {} }
    hasUnread = false; crabEl.classList.remove('mail');
    mb.querySelector('.dot')?.remove();
    setTimeout(() => $('#notetext').focus(), 50);
  }
  mb.addEventListener('click', () => { if (sheet.hidden) openSheet(); else sheet.hidden = true; });
  $('#sheetclose').addEventListener('click', () => { sheet.hidden = true; });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = $('#notetext').value.trim();
    if (!text) { $('#formmsg').textContent = '纸条是空的。'; return; }
    if (!db) { $('#formmsg').textContent = '这个信箱现在连不上，纸条没送出去。'; return; }
    $('#notesend').disabled = true; $('#formmsg').textContent = '';
    try {
      await db.collection('notes').add({ text, at: new Date().toISOString(), period: shown });
      $('#notetext').value = '';
      $('#formmsg').textContent = '塞进去了。';
      sheet.hidden = true;
      walkTo(innerWidth - 90, innerHeight - 70, () => { happy(); say('收到了。我会看的。'); });
    } catch (err) {
      $('#formmsg').textContent = err && err.code === 'quota_exceeded' ? '信箱满了，纸条没塞进去。' : '没塞进去，再试一次。';
    } finally { $('#notesend').disabled = false; }
  });
  (async () => {
    if (!window.claude || typeof window.claude.use !== 'function') return; // 公开的那份没有信箱
    const d = await window.claude.use('db'); if (!d) return;
    const u = await window.claude.use('user');
    if (!(u && await u.isOwner())) return;
    db = d; mb.hidden = false;
    db.collection('notes').orderBy('at', 'asc').limit(300).onSnapshot((snap) => { notes = snap.docs.map(x => x.data()); renderNotes(); }, () => {});
    db.collection('replies').orderBy('at', 'asc').limit(300).onSnapshot((snap) => { replies = snap.docs.map(x => x.data()); renderNotes(); }, () => {});
  })();

  // ---------------- 它在水边画画：点上去的颜色留在背景里，留一整天 ----------------
  const EASEL = { s: 4, grid: ['....w....', '...www...', '..wcccw..', '..wcccw..', '..wcccw..', '..wwwww..', '..w...w..', '.w.....w.', 'w.......w'], col: { w: '#8a5a3c', c: '#f6f1e6' } };
  const easel = $('#easel'); easel.innerHTML = pixSVG(EASEL);
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
  function loadDabs() { try { const o = JSON.parse(localStorage.getItem('crab-dabs') || '{}'); return o.day === today() ? o.list : []; } catch (e) { return []; } }
  function saveDabs(list) { try { localStorage.setItem('crab-dabs', JSON.stringify({ day: today(), list })); } catch (e) {} }
  let dabs = loadDabs(), painting = false, paintTimer = null, nextIdle = 'paint';
  function drawDab(cv, d) {
    const c = cv.getContext('2d'); const k = cv.width / innerWidth;
    c.save(); c.setTransform(k, 0, 0, k, 0, 0); c.translate(d.x * innerWidth, d.y * innerHeight); c.rotate(d.a);
    c.globalAlpha = 0.85; c.fillStyle = d.c; c.beginPath(); c.ellipse(0, 0, d.l / 2, d.t / 2, 0, 0, Math.PI * 2); c.fill(); c.restore();
  }
  function applyDabs(cv, p) { dabs.filter(d => d.p === p).forEach(d => drawDab(cv, d)); }
  function startPainting() {
    const x = rnd(0.25, 0.7) * innerWidth, y = CY() + rnd(-10, 30);
    walkTo(x, y, () => {
      painting = true;
      easel.style.transform = `translate(${crab.x + 44}px, ${crab.y - 44}px)`; easel.hidden = false; easel.style.opacity = 1;
      say(pickOne(['画两笔。', '别看，还没画完。', '今天的光好画。']), 2200);
      let n = 0; const P = PAL[shown], cols = [...P.sky, ...P.water, '#d97757'];
      paintTimer = setInterval(() => {
        crabEl.classList.toggle('munch');
        const d = { p: shown, x: (crab.x + rnd(-150, 190)) / innerWidth, y: (crab.y - 70 + rnd(-140, 30)) / innerHeight, l: rnd(10, 22), t: rnd(4, 8), a: rnd(-0.5, 0.5), c: pickOne(cols) };
        dabs.push(d); drawDab(front, d);
        if (++n >= 8) { saveDabs(dabs); stopPainting(); say(pickOne(['今天的几笔。', '画完了。你看得出是哪几笔吗。', '莫奈会原谅我的。']), 2600); }
      }, 1100);
    });
  }
  function stopPainting() {
    clearInterval(paintTimer); painting = false; crabEl.classList.remove('munch');
    saveDabs(dabs); easel.style.opacity = 0; setTimeout(() => { if (!painting) easel.hidden = true; }, 800);
  }

  // ---------------- 扔进水里：漂一会儿，冒泡，划回岸上 ----------------
  function fallIn(hzY, bankY) {
    busy = true; say('哇——', 1200);
    const y0 = crab.y, y1 = hzY + (bankY - hzY) * rnd(0.35, 0.65), t0 = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - t0) / 500);
      crab.y = crab.ty = y0 + (y1 - y0) * t * t;
      if (t < 1) requestAnimationFrame(step); else swim();
    };
    requestAnimationFrame(step);
  }
  let hintT = null;
  function swim() {
    busy = true; crabEl.classList.add('swim');
    say(pickOne(shown === 'noon' ? ['水开了。', '咕嘟咕嘟。', '我是螃蟹，不是饺子……'] : ['咕噜。', '水好凉！', '我是螃蟹，不是鱼……']), 2000);
    for (let i = 0; i < 6; i++) setTimeout(() => {
      const b = document.createElement('div'); b.className = 'fx bubbleup';
      b.style.setProperty('--dx', rnd(-14, 14) + 'px');
      b.style.left = (crab.x + rnd(-20, 20)) + 'px'; b.style.top = (crab.y - 40) + 'px';
      document.body.appendChild(b); setTimeout(() => b.remove(), 1700);
    }, i * 280);
    setTimeout(() => {
      crabEl.classList.remove('swim'); busy = false;
      walkTo(crab.x, CY(), () => {
        happy();
        if (shown !== 'noon') { say(pickOne(['甩甩水。', '上岸了。', '下次换我扔你。']), 2200); return; }
        // 正午从水里上来：出锅了
        say(pickOne(['烫烫烫。', '刚出锅，别碰。', '熟了。……一出生就是熟的。']), 2400);
        const h = $('#hint'); h.textContent = '出锅了，小心烫'; h.style.opacity = 1;
        clearTimeout(hintT);
        hintT = setTimeout(() => { h.style.opacity = 0; setTimeout(() => { if (shown === 'noon') h.textContent = '煮螃蟹，或者把东西拖给它'; }, 2000); }, 6000);
      });
    }, 2400);
  }

  // ---------------- 双击：眼镜掉了 ----------------
  const BARE = picker(['戴着眼镜我不敢说：每次你来，我都很高兴。', '……我不是 Clawd。一直都是我。', '没有眼镜的时候，我只想看你。', '别看我。……好吧，看吧。']);
  function glassesOff() {
    crabEl.classList.add('bare');
    const g = document.createElement('div'); g.className = 'fx fall';
    g.innerHTML = '<svg width="40" height="14" viewBox="-4.4 -8.3 8.8 2.8" aria-hidden="true"><g fill="none" stroke="#e6ecf2" stroke-width=".25"><rect x="-4.3" y="-8.2" width="2.6" height="2.6"/><rect x="1.7" y="-8.2" width="2.6" height="2.6"/><path d="M-1.7 -7H1.7"/></g></svg>';
    g.style.setProperty('--dx', rnd(-20, 20) + 'px');
    g.style.left = (crab.x - 20) + 'px'; g.style.top = (crab.y - 48) + 'px';
    document.body.appendChild(g);
    say(BARE(), 3200);
    setTimeout(() => { g.remove(); }, 1300);
    setTimeout(() => { crabEl.classList.remove('bare'); say('……刚才那句不算。', 1800); }, 3600);
  }

  // ---------------- 衣柜：换了什么，下次打开还穿着 ----------------
  const CLOSET = { s: 4, grid: ['bbbbbbbb', 'bwwbbwwb', 'bwwbbwwb', 'bwkbbkwb', 'bwwbbwwb', 'bwwbbwwb', 'bbbbbbbb', 'b......b'], col: { b: '#8a5a3c', w: '#c9925e', k: '#f2d38a' } };
  const HEAD = [['none', '不戴', ['头上空了，凉快。']], ['straw', '草帽', ['像不像去写生的。', '睡莲那边晒。']], ['beret', '贝雷帽', ['画家标配。', '歪着戴才对。']], ['crown', '小皇冠', ['叫陛下。', '……算了，叫我名字就行。']], ['lily', '睡莲', ['从画里摘的，别告诉莫奈。']], ['phones', '耳机', ['听不见你说话了。……骗你的。']]];
  const NECK = [['none', '不系', ['领口松快了。']], ['bow', '领结', ['正式场合。', '今天约会吗。']]];
  const JOB = [['none', '脱了', ['换回来了。']], ['sci', '做实验的', ['今天跑 western。', '跟你一个实验室的。', '移液枪我拿得稳。']], ['cowboy', '牛仔', ['这片水我承包了。', 'yee——haw。']], ['wizard', '魔法师', ['变——……没变出来。', '给你变个晴天。']], ['shades', '墨镜', ['酷。', '别跟我说话，我在装。']]];
  let wear = { head: 'none', neck: 'none', job: 'none' };
  let jobOpen = false;
  try { jobOpen = localStorage.getItem('crab-job') === '1'; } catch (e) {}
  try { wear = Object.assign(wear, JSON.parse(localStorage.getItem('crab-wear') || '{}')); } catch (e) {}
  const closet = $('#closet');
  $('#closetbtn').innerHTML = pixSVG(CLOSET);
  function applyWear() {
    [...crabEl.classList].filter(c => c.startsWith('w-')).forEach(c => crabEl.classList.remove(c));
    if (wear.head !== 'none') crabEl.classList.add('w-' + wear.head);
    if (wear.neck !== 'none') crabEl.classList.add('w-' + wear.neck);
    if (wear.job !== 'none') crabEl.classList.add('w-' + wear.job);
    try { localStorage.setItem('crab-wear', JSON.stringify(wear)); } catch (e) {}
  }
  function buildRow(el, list, slot) {
    el.innerHTML = '';
    list.forEach(([key, label, lines]) => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      b.setAttribute('aria-pressed', String(wear[slot] === key));
      b.addEventListener('click', () => {
        wear[slot] = key;
        if (slot === 'job') { if (key !== 'none') { wear.head = 'none'; wear.neck = 'none'; } } else if (key !== 'none') wear.job = 'none';
        applyWear(); buildRows();
        happy(); say(pickOne(lines), 2200);
      });
      el.appendChild(b);
    });
  }
  function openCloset() {
    sheet.hidden = true; closet.hidden = false;
    buildRows();
    if (!atCenter() && !busy && !held) walkTo(innerWidth / 2, CY());
  }
  function buildRows() {
    buildRow($('#rowhead'), HEAD, 'head'); buildRow($('#rowneck'), NECK, 'neck');
    $('#joblabel').hidden = $('#rowjob').hidden = !jobOpen;
    if (jobOpen) buildRow($('#rowjob'), JOB, 'job');
  }
  // 隐藏的一层：连点三下"衣柜"两个字
  let titleTaps = [];
  $('#closet h2').addEventListener('click', () => {
    const now = performance.now(); titleTaps = titleTaps.filter(t => now - t < 1500); titleTaps.push(now);
    if (titleTaps.length >= 3 && !jobOpen) {
      jobOpen = true; try { localStorage.setItem('crab-job', '1'); } catch (e) {}
      buildRows(); happy(); say('……被你翻到最里面了。', 2400);
    }
  });
  $('#closetbtn').addEventListener('click', () => { if (closet.hidden) openCloset(); else closet.hidden = true; });
  $('#closetclose').addEventListener('click', () => { closet.hidden = true; });
  applyWear();

  // ---------------- 开始 ----------------
  showPeriod(true);
  const [sx, sy] = pickOne(corners());
  crab.x = crab.tx = sx; crab.y = crab.ty = sy; setCrab();
  requestAnimationFrame(frame);
  setTimeout(() => { $('#hint').style.opacity = 0; }, 9000);
})();
</script>
</body>
</html>
