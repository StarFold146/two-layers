<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>两层颜色</title>
<meta name="description" content="给一个空世界选第一种颜色，再帮住在里面的小螃蟹几个忙。结果是两层颜色：你想造的，和它实际长成的。">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" media="print" onload="this.media='all'">
<style>
html{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* 布局：整屏是一张会被一笔笔画出来的画，就是小东西住的世界。上面是动手的地方，下面是它说话的地方；它自己会在画里走来走去。只有一种视觉：颜色由玩家定，墨色跟着明暗翻。 */
:root{
  color-scheme:dark;
  --void:#0b0b10;
  --world:#0b0b10;
  --ink:#f3f1ec;
  --ink-soft:rgba(243,241,236,.64);
  --line:rgba(243,241,236,.3);
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%}
body{background:var(--world);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;overflow:hidden;-webkit-tap-highlight-color:transparent}
body.ease{transition:background-color 1.4s ease}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

#world{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity 1.2s ease}
#app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;padding-inline:16px;padding-block:12px 18px;max-width:760px;margin:0 auto;position:relative;z-index:1}
#play{position:relative;display:grid;grid-template:minmax(0,1fr)/minmax(0,1fr);place-items:center;min-height:0}
#play>*{grid-area:1/1}

/* 小东西 */
#who{position:absolute;left:0;top:0;width:60px;height:40px;overflow:visible;pointer-events:none;z-index:3;opacity:0;
  transform:translate(var(--x,0px),var(--y,0px)) scale(var(--k,1));transition:transform .95s cubic-bezier(.3,.7,.2,1),opacity .9s}
#who.ghost{opacity:.07}
#who.loud{opacity:.94}
#who.here{opacity:1}
#who.still{transition:opacity .9s}
#who .grin,#who .sweat{display:none}
#who.happy .eye{display:none}
#who.happy .grin,#who.happy .sweat{display:block}

/* 说话的地方 */
#talkrow{display:grid;grid-template-columns:60px minmax(0,1fr);gap:14px;align-items:end;min-height:104px}
#seat{width:60px;height:40px}
#talk{all:unset;box-sizing:border-box;display:block;width:100%;min-width:0;cursor:pointer;padding:8px 4px 8px 0;border-radius:6px}
#talk:disabled{cursor:default}
#talk:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#line{font-family:var(--serif);font-size:17px;line-height:1.65;margin:0;min-height:1.65em;text-wrap:pretty;transition:opacity .6s}
#line.faint{opacity:.12}
#more{display:inline-block;margin-left:2px;font-size:13px;color:var(--ink-soft)}
#talk:disabled #more{visibility:hidden}
#talk.quiet #more{visibility:hidden}
#aside{position:absolute;left:16px;right:16px;bottom:146px;font-family:var(--serif);font-size:16px;color:var(--ink);border-left:2px solid var(--ink);padding:2px 0 2px 12px;opacity:0;transition:opacity .5s;pointer-events:none;z-index:4}
#aside.on{opacity:1}
#wipe{position:absolute;top:10px;left:16px;font-size:12px;letter-spacing:.08em;color:var(--ink-soft);background:none;border:0;padding:6px 0;cursor:pointer;z-index:4}

/* 注：灰字，躲在小螃蟹后面的那个人写的 */
#note{place-self:start center;margin-top:52px;max-width:25em;width:100%;box-sizing:border-box;border-left:1px solid var(--line);padding:2px 0 2px 14px;
  font-family:var(--serif);font-size:14.5px;line-height:1.95;letter-spacing:.03em;color:var(--ink-soft);opacity:0;transition:opacity 1.1s ease;pointer-events:none;z-index:2}
#note.on{opacity:1}
#note.on.dim{opacity:.5}
#note p{margin:0}
#eggnote{font-family:var(--serif);font-size:14px;line-height:1.9;color:rgba(243,241,236,.55);max-width:25em;margin:0;border-left:1px solid rgba(243,241,236,.3);padding-left:14px}

/* 调色 */
#picker{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
#orb{width:72px;height:72px;border-radius:50%;border:1.5px dashed var(--line)}
#orb.on{border-style:solid;border-color:transparent}
#pad{position:relative;width:min(100%,420px);height:min(34vh,220px);border-radius:10px;touch-action:none;cursor:crosshair;border:1px solid var(--line)}
#dot{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px #000;transform:translate(-50%,-50%);pointer-events:none}
.satrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;width:min(100%,420px);font-size:13px;color:var(--ink-soft)}
#sat{width:100%;accent-color:var(--ink)}
.pill{border:1px solid var(--ink);background:none;border-radius:999px;padding:8px 22px;cursor:pointer;font-family:var(--serif);font-size:16px}
.pill:disabled{opacity:.35;cursor:default}
#flood{position:fixed;left:50%;top:50%;border-radius:50%;pointer-events:none;z-index:5}

/* 开关 */
#switch{width:128px;height:128px;border-radius:50%;border:1.5px solid var(--ink);background:none;cursor:pointer;margin-bottom:70px;
  font-family:var(--serif);font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#switch.down{background:var(--ink);color:var(--world)}

/* 路 */
#path{place-self:stretch;width:100%;height:100%;min-height:220px;touch-action:none;cursor:crosshair;display:block}

/* 窗 */
#sky{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
#window{width:min(58vw,230px);aspect-ratio:4/5;max-width:100%;border:3px solid var(--ink);border-radius:120px 120px 6px 6px;position:relative;overflow:hidden;background:transparent;transition:background 1s}
#window::before,#window::after{content:"";position:absolute;background:var(--ink)}
#window::before{left:50%;top:0;bottom:0;width:3px;transform:translateX(-50%)}
#window::after{top:56%;left:0;right:0;height:3px}
#swatches{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:420px}
.sw{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px 5px 6px;cursor:pointer;font-size:14px}
.sw i{width:18px;height:18px;border-radius:50%;flex:none}
.sw[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--world)}

/* 门 */
#door{display:flex;flex-direction:column;align-items:center;gap:22px}
#leaf{width:116px;height:190px;border:3px solid var(--ink);border-radius:4px;position:relative;transform-origin:left center;transition:transform 1s ease}
#leaf::after{content:"";position:absolute;right:14px;top:50%;width:10px;height:10px;border-radius:50%;background:var(--ink)}
#leaf.knock{animation:knock .5s 4}
#leaf.open{transform:perspective(600px) rotateY(-62deg)}
@keyframes knock{0%,100%{transform:translateX(0)}30%{transform:translateX(2px)}60%{transform:translateX(-2px)}}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* 结果 */
#result,#egg{position:fixed;inset:0;overflow:auto;z-index:10}
#poster{position:relative;min-height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto minmax(120px,1fr) auto;padding-inline:20px;padding-block:calc(28px + env(safe-area-inset-top,0px)) 30px}
#below{padding-inline:20px;padding-block:4px calc(30px + env(safe-area-inset-bottom,0px))}
.hint{font-size:12px;letter-spacing:.14em;opacity:.6;margin-top:14px}
.layer{max-width:620px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.18em;opacity:.72}
.cname{font-family:var(--serif);font-size:30px;line-height:1.2;font-weight:600}
.hex{font-family:var(--mono);font-size:12px;letter-spacing:.08em;opacity:.72}
#title{align-self:center;justify-self:center;text-align:center;font-family:var(--serif);font-size:clamp(26px,7vw,44px);font-weight:600;line-height:1.3;text-wrap:balance;max-width:14em;padding:24px 0;margin:0}
#notes{display:flex;flex-direction:column;gap:8px;margin:0 0 20px;font-family:var(--serif);font-size:16px;line-height:1.75;max-width:30em}
#notes p{margin:0}
#notes .assoc{margin-top:10px;padding-top:14px;border-top:1px solid currentColor;display:flex;flex-direction:column;gap:8px}
#notes .assoc .eyebrow{font-family:var(--sans)}
#notes .tag{display:inline-block;font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:.1em;border:1px solid currentColor;border-radius:999px;padding:0 8px;margin-right:8px;line-height:1.7;opacity:.8;vertical-align:1px}
#fold{position:absolute;top:0;right:0;width:64px;height:64px;border:0;padding:0;cursor:pointer;background:none}
#fold i{position:absolute;inset:0;clip-path:polygon(100% 0,100% 100%,0 0);background:var(--void)}
#fold b{position:absolute;inset:0;clip-path:polygon(0 0,0 100%,100% 100%);background:rgba(255,255,255,.46)}
@media (prefers-reduced-motion:no-preference){#fold b{animation:peek 5s 4s infinite}}
@keyframes peek{0%,88%,100%{transform:none}94%{transform:translate(-3px,3px)}}
#confirm{margin-top:4px;font-family:var(--serif);font-size:16px;display:flex;flex-direction:column;gap:10px}

/* 彩蛋 */
#egg{background:var(--void);color:#f3f1ec;padding-inline:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;align-items:center}
#egghead{font-family:var(--serif);font-size:22px;margin:6px 0 0;min-height:1.6em;text-align:center}
#pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:620px}
.strip{display:flex;flex-direction:column;gap:6px;min-width:0}
.strip .grad{height:min(38vh,300px);border-radius:8px}
.strip .whose{font-size:12px;letter-spacing:.18em;opacity:.7}
.strip .nm{font-family:var(--serif);font-size:17px}
#eggsay{width:100%;max-width:620px;display:flex;flex-direction:column;gap:8px;font-family:var(--serif);font-size:16px;line-height:1.75}
#eggsay p{margin:0}
#eggsay .last{margin-top:8px;padding-top:12px;border-top:1px solid rgba(243,241,236,.25)}
#eggfoot{width:100%;max-width:620px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
#made{font-family:var(--mono);font-size:11px;letter-spacing:.1em;opacity:.6}
#egg .pill{border-color:#f3f1ec;color:#f3f1ec}
</style>
</head>
<body>
<canvas id="world" aria-hidden="true"></canvas>

<div id="app">
  <button id="wipe" type="button" hidden>重来</button>

  <div id="play">
    <div id="note"><p id="notetext"></p></div>
    <div id="picker" hidden>
      <div id="orb" aria-hidden="true"></div>
      <div id="pad" tabindex="0" role="application" aria-label="调色板。左右换色相，上下换明暗，方向键也可以。"><i id="dot" hidden></i></div>
      <div class="satrow"><label for="sat">浓淡</label><input id="sat" type="range" min="0" max="100" value="82"></div>
      <button id="pickok" class="pill" type="button" disabled>就是它</button>
    </div>
    <button id="switch" type="button" hidden>按住</button>
    <canvas id="path" hidden aria-label="在这里画一条回家的路"></canvas>
    <div id="sky" hidden>
      <div id="window" aria-hidden="true"></div>
      <div id="swatches"></div>
      <button id="skyok" class="pill" type="button" disabled>就这片</button>
    </div>
    <div id="door" hidden>
      <div id="leaf" aria-hidden="true"></div>
      <div class="row">
        <button id="dooropen" class="pill" type="button">开门</button>
        <button id="doorshut" class="pill" type="button">不开</button>
      </div>
    </div>
  </div>

  <div id="aside" role="status"></div>

  <div id="talkrow">
    <div id="seat"></div>
    <button id="talk" type="button"><p id="line"></p><span id="more">点一下，往下</span></button>
  </div>

  <svg id="who" viewBox="-7.5 -9.5 15 10" shape-rendering="crispEdges" aria-hidden="true">
    <g fill="#1c1a19"><rect x="-6.17" y="-9.17" width="12.34" height="7.34"/><rect x="-7.17" y="-7.17" width="1.34" height="2.34"/><rect x="5.83" y="-7.17" width="1.34" height="2.34"/><rect x="-5.17" y="-2.17" width="1.34" height="2.34"/><rect x="-2.17" y="-2.17" width="1.34" height="2.34"/><rect x="0.83" y="-2.17" width="1.34" height="2.34"/><rect x="3.83" y="-2.17" width="1.34" height="2.34"/></g>
    <g fill="#d97757"><rect x="-6" y="-9" width="12" height="7"/><rect x="-7" y="-7" width="1" height="2"/><rect x="6" y="-7" width="1" height="2"/><rect x="-5" y="-2" width="1" height="2"/><rect x="-2" y="-2" width="1" height="2"/><rect x="1" y="-2" width="1" height="2"/><rect x="4" y="-2" width="1" height="2"/></g>
    <g class="eye" fill="#1c1a19"><rect x="-3.5" y="-7.5" width="1" height="2"/><rect x="2.5" y="-7.5" width="1" height="2"/></g>
    <g class="grin" fill="#1c1a19"><rect x="-3.75" y="-6.5" width=".5" height=".5"/><rect x="-3.25" y="-7" width=".5" height=".5"/><rect x="-2.75" y="-6.5" width=".5" height=".5"/><rect x="2.25" y="-6.5" width=".5" height=".5"/><rect x="2.75" y="-7" width=".5" height=".5"/><rect x="3.25" y="-6.5" width=".5" height=".5"/></g>
    <g fill="none" stroke="#e6ecf2" stroke-width=".2"><rect x="-4.3" y="-8.2" width="2.6" height="2.6"/><rect x="1.7" y="-8.2" width="2.6" height="2.6"/><path d="M-1.7 -7H1.7"/></g>
    <g class="sweat" fill="#cfe6f5"><rect x="7.6" y="-9.3" width=".5" height=".9"/><rect x="8.5" y="-8.3" width=".5" height=".9"/></g>
  </svg>
</div>

<div id="flood" hidden></div>

<section id="result" hidden aria-label="结果">
  <div id="poster">
    <button id="fold" type="button" aria-label="翻开右上角的折角"><i></i><b></b></button>
    <div class="layer" id="top">
      <div class="eyebrow">你想造的</div>
      <div class="cname" id="n0"></div>
      <div class="hex" id="h0"></div>
    </div>
    <h1 id="title"></h1>
    <div class="layer" id="bottom">
      <div class="eyebrow">它长成的</div>
      <div class="cname" id="n1"></div>
      <div class="hex" id="h1"></div>
      <div class="hint">往下，是它想跟你说的</div>
    </div>
  </div>
  <div id="below">
    <div class="layer">
      <div id="notes"></div>
      <div class="row" style="justify-content:flex-start"><button id="again" class="pill" type="button">再造一个</button></div>
      <div id="confirm" hidden>
        <span>你要把我们都抹掉吗？</span>
        <div class="row" style="justify-content:flex-start">
          <button id="yes" class="pill" type="button">抹掉</button>
          <button id="no" class="pill" type="button">留着</button>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="egg" hidden aria-label="它的世界">
  <p id="egghead"></p>
  <p id="eggnote">庄周有一回梦见自己变成了蝴蝶，飞得很高兴。可是醒来以后他想了很久，还是分不清，到底是他梦见了蝴蝶，还是蝴蝶梦见了他。所以现在，轮到我来造一个世界给你看。</p>
  <div id="pair" hidden>
    <div class="strip"><div class="grad" id="g-you"></div><div class="whose">你的</div><div class="nm" id="nm-you"></div></div>
    <div class="strip"><div class="grad" id="g-it"></div><div class="whose">我的</div><div class="nm" id="nm-it"></div></div>
  </div>
  <div id="eggsay"></div>
  <div id="eggfoot">
    <button id="eggback" class="pill" type="button">回去</button>
    <span id="made">made with Claude</span>
  </div>
</section>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var clamp=function(x,a,b){return Math.min(b,Math.max(a,x))};
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var FLAG='two-layers-v2-live';
var samplePromise=(window.claude&&typeof window.claude.use==='function')?window.claude.use('sample').catch(function(){return null}):Promise.resolve(null);
function wait(ms){return new Promise(function(r){setTimeout(r,reduce?Math.min(ms,60):ms)})}

/* ---------- 颜色 ---------- */
function hsl2rgb(c){var h=((c.h%360)+360)%360,s=c.s/100,l=c.l/100,k=function(n){return (n+h/30)%12},a=s*Math.min(l,1-l),
  f=function(n){return l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))};return [f(0),f(8),f(4)]}
function css(c){return 'hsl('+c.h.toFixed(1)+' '+c.s.toFixed(1)+'% '+c.l.toFixed(1)+'%)'}
function hex(c){return '#'+hsl2rgb(c).map(function(v){return ('0'+Math.round(v*255).toString(16)).slice(-2)}).join('').toUpperCase()}
function lin(v){return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4)}
function lum(c){var r=hsl2rgb(c).map(lin);return 0.2126*r[0]+0.7152*r[1]+0.0722*r[2]}
function oklab(c){var r=hsl2rgb(c).map(lin),l=Math.cbrt(0.4122*r[0]+0.5363*r[1]+0.0514*r[2]),m=Math.cbrt(0.2119*r[0]+0.6807*r[1]+0.1074*r[2]),s=Math.cbrt(0.0883*r[0]+0.2817*r[1]+0.63*r[2]);
  return [0.2105*l+0.7936*m-0.0041*s,1.978*l-2.4286*m+0.4506*s,0.0259*l+0.7828*m-0.8087*s]}
function dist(a,b){var x=oklab(a),y=oklab(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])}
function ang(a,b){return ((b-a+540)%360)-180}
function inkFor(c){return lum(c)>0.36?'#16151a':'#f3f1ec'}
function setWorld(c,ease){
  document.body.classList.toggle('ease',!!ease);
  var col=typeof c==='string'?c:css(c), dark=typeof c==='string'?true:lum(c)<=0.36, r=document.documentElement.style;
  r.setProperty('--world',col);
  r.setProperty('--ink',dark?'#f3f1ec':'#16151a');
  r.setProperty('--ink-soft',dark?'rgba(243,241,236,.64)':'rgba(22,21,26,.66)');
  r.setProperty('--line',dark?'rgba(243,241,236,.3)':'rgba(22,21,26,.3)');
}
var HUES=[[15,'朱'],[40,'橘'],[65,'蜜'],[95,'芽'],[150,'翠'],[180,'青瓷'],[205,'湖'],[230,'钴'],[260,'靛'],[290,'堇'],[325,'洋红'],[345,'蔷薇'],[361,'朱']];
function hueName(c){var h=((c.h%360)+360)%360;if(c.s<10)return '墨';for(var i=0;i<HUES.length;i++){if(h<HUES[i][0])return HUES[i][1]}return '朱'}
function modName(c){return c.l<26?'暗':c.l>76?'浅':c.s<42?'雾':(c.s>74&&c.l>34&&c.l<66)?'浓':'正'}
function nameOf(c){if(c.s<10)return c.l<22?'墨':c.l>80?'近白':'灰';return modName(c)+hueName(c)}

/* ---------- 规则：动作算出颜色 ---------- */
var SKIES=[{id:'dawn',name:'清晨',h:28,l:66},{id:'rain',name:'雨前',h:172,l:48},{id:'noon',name:'正午',h:205,l:62},{id:'night',name:'深夜',h:246,l:26},{id:'violet',name:'黎明前',h:282,l:40},{id:'dusk',name:'黄昏',h:332,l:56}];
function skyById(id){for(var i=0;i<SKIES.length;i++) if(SKIES[i].id===id) return SKIES[i];return SKIES[2]}
function lightOf(hold){return 8+70*(1-Math.exp(-hold/4.5))}
function satOf(straight,seconds){var sp=clamp(1-(seconds-0.6)/6,0,1);return 28+66*(0.65*clamp(straight,0,1)+0.35*sp)}
function grow(a){
  var c={h:a.sky.h,s:satOf(a.path.straight,a.path.seconds),l:lightOf(a.light.hold)};
  if(a.door.open){c.h+=22;c.l+=4}else{c.l-=6;c.s+=6}

  '4. 窗外的天，从这六片里挑一片：'+sk+'。\n5. 门外有声音：open 是开不开门，wait 是犹豫了几秒（0 到 20）。犹豫越久颜色越灰；开门会让色相偏一点、亮一点，不开会暗一点、浓一点。\n\n'+
  '那个人的做法：第一种颜色 HSL('+Math.round(st.first.h)+', '+Math.round(st.first.s)+'%, '+Math.round(st.first.l)+'%)；开关按了 '+fmt(st.light.hold)+' 秒；路的直度 '+st.path.straight.toFixed(2)+'，画了 '+fmt(st.path.seconds)+' 秒；天挑了'+st.sky.name+'，换了 '+st.sky.switches+' 次；敲门时犹豫 '+fmt(st.door.wait)+' 秒，'+(st.door.open?'开了':'没开')+'；中途离开页面 '+st.away.n+' 次。\n\n'+
  '按你自己的意思选，不用模仿那个人，也不用讨好。每一步配一句中文短句，说你为什么这么选：第一人称，口语，每句不超过 30 个字，不用比喻，不用破折号。last 是你看完两个世界以后想对那个人说的一句话，同样的要求。\n\n'+
  '只回复一个 JSON 对象，格式如下：\n{"first":{"h":210,"s":60,"l":50,"say":"……"},"light":{"hold":5,"say":"……"},"path":{"straight":0.8,"seconds":3,"say":"……"},"sky":{"pick":"noon","say":"……"},"door":{"open":true,"wait":2,"say":"……"},"last":"……"}';
}
var eggBusy=false;
function openEgg(){
  if(eggBusy||!st.door)return;eggBusy=true;
  var E=$('#egg'),head=$('#egghead'),sayBox=$('#eggsay');
  $('#pair').hidden=true;sayBox.textContent='';head.textContent='现在换我了。';E.hidden=false;E.scrollTop=0;
  var waitSample=Promise.race([samplePromise,new Promise(function(r){setTimeout(function(){r(null)},2500)})]);
  waitSample.then(function(sample){
    if(!sample) return null;
    head.textContent='现在换我了。我想一下。';
    return sample.json(promptFor(),{modelTier:'quick',cache:false}).then(cleanPlan).catch(function(){return null});
  }).then(function(plan){
    var real=!!plan;if(!plan)plan=mirrorPlan();
    var sk=skyById(plan.sky.pick),mine=grow({light:{hold:plan.light.hold},path:{straight:plan.path.straight,seconds:plan.path.seconds},sky:{h:sk.h},door:{open:plan.door.open,wait:plan.door.wait}});
    paint($('#g-you'),st.first,st.cur);paint($('#g-it'),plan.first,mine);
    $('#nm-you').textContent=titleFor(st.first,st.cur);$('#nm-it').textContent=titleFor(plan.first,mine);
    head.textContent='现在换我了。';$('#pair').hidden=false;
    [plan.first.say,plan.light.say,plan.path.say,plan.sky.say,plan.door.say].forEach(function(t){if(!t)return;var p=document.createElement('p');p.textContent=t;sayBox.appendChild(p)});
    if(plan.last){var l=document.createElement('p');l.className='last';l.textContent=plan.last;sayBox.appendChild(l)}
    $('#made').textContent=(real||!window.claude)?'made with Claude':'made with Claude · 这次它没连上，用的是照着你做的那一版';
    eggBusy=false;
  });
}
$('#fold').onclick=openEgg;
$('#eggback').onclick=function(){$('#egg').hidden=true};

/* ---------- 流程 ---------- */
function start(wiped){
  var my=++gen;fresh();setFlag(false);
  clearTimeout(timer);finish=null;if(curGo){talk.removeEventListener('click',curGo);curGo=null}
  $('#result').hidden=true;$('#egg').hidden=true;$('#flood').hidden=true;$('#wipe').hidden=true;
  showOnly(null);noteOff();who.setAttribute('class','');setWorld('#0b0b10',false);sizeWorld();clearWorld();lineEl.textContent='';lineEl.classList.remove('faint');
  var alive=function(){if(my!==gen)throw 0};
  intro()
  .then(function(){alive();return say(wiped?['你回来了。','上一个世界被抹掉了……没关系。','这里又什么都没有了，我也又变回半透明的了。']:['你好呀。','这里还什么都没有。你看，连我都是半透明的。'])})
  .then(function(){alive();return note('genesis')})
  .then(function(){alive();return tell('给它第一种颜色吧，好不好？')})
  .then(function(){alive();return pickColor()})
  .then(function(c){alive();st.first=c;st.cur={h:c.h,s:c.s,l:c.l};st.playing=true;setFlag(true);lineEl.textContent='';return flood(c)})
  .then(function(){alive();mood('here');hop();$('#wipe').hidden=false;paintWorld(true);return note('eden')})
  .then(function(){alive();
    return say(['哇。','亮了亮了。','我比你早到一小会儿。你造的地方，我来住。','才刚开始，有些东西还不太对。你帮帮我嘛。'])})
  .then(function(){alive();noteOff();wc.style.opacity=0;setWorld({h:st.cur.h,s:st.cur.s,l:8},true);return one('啊。')})
  .then(function(){alive();return note('cave')})
  .then(function(){alive();return say(['灯灭了。','墙上有个开关，我跳起来也够不着。'])})
  .then(function(){alive();return tell('你替我按住它，好吗？想松手的时候就松。')})
  .then(function(){alive();return holdSwitch()})
  .then(function(t){alive();st.light={hold:t};st.cur.l=lightOf(t);setWorld(st.cur,true);paintWorld(false);wc.style.opacity=1;goHome();
    return say([t<1?'这么快呀。':t>9?'你按了好久。手酸不酸？':'好啦。','就这么亮吧，我喜欢。'])})
  .then(function(){alive();return note('thread')})
  .then(function(){alive();return one('……糟了。我刚才走远了一点，找不到回来的路了。')})
  .then(function(){alive();return tell('你在地上画一条，我顺着走回去。')})
  .then(function(){alive();return drawPath()})
  .then(function(p){alive();st.path=p;st.cur.s=satOf(p.straight,p.seconds);setWorld(st.cur,true);showOnly(null);paintWorld(true,p.fx,p.fy);goHome();
    return one(p.reached?'到家了！':'这条路没到家。没事，剩下的我自己摸回来了。')})
  .then(function(){alive();return note('monad')})
  .then(function(){alive();return one('屋里有扇窗。可是外面还没有天。')})
  .then(function(){alive();return tell('你挑一片吧。多看几眼再定也行，我陪你看。')})
  .then(function(){alive();return pickSky()})
  .then(function(k){alive();st.sky=k;st.cur.h=k.h;setWorld(st.cur,true);showOnly(null);paintWorld(true,k.fx,k.fy);goHome();
    return one('嗯！以后每天醒来，看见的就是它了。')})
  .then(function(){alive();return note('room')})
  .then(function(){alive();return say(['……','你听。','有人敲门。','这里除了我，应该没有别人呀。'])})
  .then(function(){alive();return tell('开吗？')})
  .then(function(){alive();return askDoor()})
  .then(function(d){alive();st.door=d;st.cur=grow(st);setWorld(st.cur,true);paintWorld(true,d.fx,d.fy);
    return say(d.open?['门外没有人。','有一点风进来了，带着外面的颜色。凉凉的。']:['声音停了。','它走了。我们谁也不知道那是什么。也好。'])})
  .then(function(){alive();showOnly(null);goHome();return note('ship')})
  .then(function(){alive();
    var r=['世界差不多造好了。','那个……有件事要跟你坦白。','我一直在看你。',
      '灯，你按了 '+fmt(st.light.hold)+' 秒才松手。',
      '路，你画得'+(st.path.straight>0.85?'很直':st.path.straight>0.6?'拐了几个弯':'绕了很远')+'，用了 '+fmt(st.path.seconds)+' 秒。',
      st.sky.switches<=1?'窗前你只看了一眼，就定了。':'窗前你换了 '+st.sky.switches+' 次，过了 '+fmt(st.sky.dwell)+' 秒才定下来。',
      '敲门声响了 '+fmt(st.door.wait)+' 秒，你才'+(st.door.open?'开':'决定不开')+'。'];
    if(st.away.n)r.push('中间你走开过 '+st.away.n+' 次。我数着呢。');
    r.push('这些我都记着。','来，给你看看它长成了什么样。');return say(r)})
  .then(function(){alive();noteOff();showResult()})
  .catch(function(e){if(e!==0)throw e});
}
start(getFlag());
})();
</script>
